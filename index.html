function ImportarCsvModal({ onClose, onImportar }){
  const [texto, setTexto] = useState('codigo;nome;carteira;valor;vencimento\n1001;Fulano de Tal;Celeste;1500,00;10');
  const [parsed, setParsed] = useState(null); // { headers, linhasDados, delimitador }
  const [mapeamento, setMapeamento] = useState({ codigo:'', nome:'', carteira:'', valor:'', vencimento:'' });

  function detectarColunas(){
    const r = parseCsv(texto);
    setParsed(r);
    setMapeamento(adivinharMapeamento(r.headers));
  }

  const preview = useMemo(() => {
    if (!parsed) return [];
    const idx = campo => parsed.headers.indexOf(mapeamento[campo]);
    const iCodigo = idx('codigo'), iNome = idx('nome'), iCarteira = idx('carteira'), iValor = idx('valor'), iVencimento = idx('vencimento');
    return parsed.linhasDados.map(linha => ({
      codigo: iCodigo>=0 ? linha[iCodigo] : '',
      nome: iNome>=0 ? linha[iNome] : '',
      carteira: iCarteira>=0 ? linha[iCarteira] : '',
      valor: iValor>=0 ? linha[iValor] : '',
      vencimento: iVencimento>=0 ? linha[iVencimento] : '',
    }));
  }, [parsed, mapeamento]);

  // Validações (item 18: nunca duplicar, e nunca importar lixo silenciosamente).
  const codigosVistos = new Map();
  const linhasComProblema = new Set();
  preview.forEach((p, i) => {
    if (!p.codigo || !p.nome) { linhasComProblema.add(i); return; }
    if (codigosVistos.has(p.codigo)) { linhasComProblema.add(i); linhasComProblema.add(codigosVistos.get(p.codigo)); }
    codigosVistos.set(p.codigo, i);
  });
  const podeImportar = parsed && mapeamento.codigo && mapeamento.nome && preview.length > 0 && linhasComProblema.size === 0;

  const CAMPOS = [
    { key:'codigo', label:'Código (obrigatório)' },
    { key:'nome', label:'Nome (obrigatório)' },
    { key:'carteira', label:'Carteira' },
    { key:'valor', label:'Valor da mensalidade' },
    { key:'vencimento', label:'Dia de vencimento' },
  ];

  return (
    <Modal titulo="Importar clientes por CSV" onClose={onClose} wide
      footer={<><button className="btn btn-s" onClick={onClose}>Cancelar</button><button className="btn btn-g" onClick={()=>onImportar(preview)} disabled={!podeImportar}>Confirmar importação ({preview.length})</button></>}>
      <div className="mbody">
        <p style={{fontSize:12,color:'var(--t2)',marginBottom:8}}>
          Cole os dados exportados (vírgula ou ponto-e-vírgula, com ou sem aspas). O código é o identificador único: se já existir, o cliente é atualizado em vez de duplicado — campos deixados em branco na planilha não apagam o que já está cadastrado.
        </p>
        <textarea className="fi" style={{minHeight:140,fontFamily:'JetBrains Mono, monospace',fontSize:12}} value={texto} onChange={e=>{ setTexto(e.target.value); setParsed(null); }} />
        <button className="btn btn-s btn-sm" style={{marginTop:8}} onClick={detectarColunas}>Detectar colunas</button>

        {parsed && (
          <>
            <div className="fsec" style={{marginTop:16}}>
              Mapeamento de colunas {parsed.delimitador===';' ? '(separador: ;)' : '(separador: ,)'}
            </div>
            <div className="fr">
              {CAMPOS.map(c => (
                <div className="fg" key={c.key}>
                  <label className="fl">{c.label}</label>
                  <select className="fs" value={mapeamento[c.key]} onChange={e=>setMapeamento({...mapeamento, [c.key]: e.target.value})}>
                    <option value="">— não importar —</option>
                    {parsed.headers.map(h => <option key={h} value={h}>{h}</option>)}
                  </select>
                </div>
              ))}
            </div>

            {!mapeamento.codigo || !mapeamento.nome ? (
              <p style={{fontSize:12,color:'var(--red)',marginTop:8}}>Selecione pelo menos as colunas de Código e Nome pra continuar.</p>
            ) : linhasComProblema.size > 0 ? (
              <p style={{fontSize:12,color:'var(--red)',marginTop:8}}>
                {linhasComProblema.size} linha(s) com problema (código/nome em branco ou código duplicado no arquivo) — destacadas em vermelho abaixo. Corrija na planilha e cole de novo antes de importar.
              </p>
            ) : (
              <p style={{fontSize:12,color:'var(--green)',marginTop:8}}>Tudo certo — {preview.length} cliente(s) prontos pra importar.</p>
            )}

            <div className="fsec" style={{marginTop:12}}>Prévia</div>
            <div style={{maxHeight:280,overflowY:'auto'}}>
              <table className="tbl">
                <thead><tr><th>Código</th><th>Nome</th><th>Carteira</th><th>Valor</th><th>Vencimento</th></tr></thead>
                <tbody>
                  {preview.map((p,i)=>(
                    <tr key={i} style={linhasComProblema.has(i) ? { background:'var(--redl)' } : undefined}>
                      <td>{p.codigo || '—'}</td><td>{p.nome || '—'}</td><td>{p.carteira || '—'}</td><td>{p.valor || '—'}</td><td>{p.vencimento || '—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </>
        )}
      </div>
    </Modal>
  );
}

function ClientesView({ clientes, cobrancas, tarefas, historico, config, usuario, busca, onAbrirCliente }){
  const [modalNovo, setModalNovo] = useState(false);
  const [editando, setEditando] = useState(null);
  const [importando, setImportando] = useState(false);
  const [mostrarInativos, setMostrarInativos] = useState(false);
  const [excluindo, setExcluindo] = useState(null);

  const filtrados = clientes.filter(c => !busca || `${c.nome} ${c.codigo}`.toLowerCase().includes(busca.toLowerCase()));

  async function salvar(form){
    if (!form.codigo || !form.nome) return;
    if (form.id) { await atualizarDoc('clientes', form.id, form); }
    else { await criarDoc('clientes', { ...form, etapaAtual: null, createdAt: new Date().toISOString() }); }
    setModalNovo(false); setEditando(null);
  }
  async function excluirCliente(c, e){
    e.stopPropagation();
    const cobrancasDele = (cobrancas||[]).filter(cb=>cb.clienteId===c.id).length;
    const tarefasDele = (tarefas||[]).filter(t=>t.clienteId===c.id).length;
    if (!confirm(`Excluir "${c.nome}" (${c.codigo})? Isso também apaga ${cobrancasDele} cobrança(s), ${tarefasDele} tarefa(s) e o histórico dele. Essa ação não pode ser desfeita.`)) return;
    setExcluindo(c.id);
    try {
      for (const cb of (cobrancas||[]).filter(cb=>cb.clienteId===c.id)) await excluirDoc('cobrancas', cb.id);
      for (const t of (tarefas||[]).filter(t=>t.clienteId===c.id)) await excluirDoc('tarefas', t.id);
      for (const h of (historico||[]).filter(h=>h.clienteId===c.id)) await excluirDoc('historico', h.id);
      await excluirDoc('clientes', c.id);
    } finally {
      setExcluindo(null);
    }
  }
  async function importar(linhas){
    for (const l of linhas) {
      if (!l.codigo) continue;
      const existente = clientes.find(c => c.codigo === l.codigo);
      // Bug corrigido: reimportar uma planilha pra só atualizar valor/
      // vencimento não pode apagar a carteira do cliente quando aquela
      // coluna vier em branco na linha — só sobrescreve o que veio
      // preenchido, preserva o resto (item 18: nunca duplicar/perder dado).
      const dados = {
        codigo: l.codigo,
        nome: l.nome || existente?.nome || l.codigo,
        carteira: l.carteira || existente?.carteira || '',
        cobrancaRecorrente: (l.valor && l.vencimento) ? { ativo:true, valor: parseMoney(l.valor), diaVencimento: Number(l.vencimento), periodicidade: existente?.cobrancaRecorrente?.periodicidade || 'MENSAL', dataInicial: existente?.cobrancaRecorrente?.dataInicial || new Date().toISOString(), dataFinal: existente?.cobrancaRecorrente?.dataFinal || null, quantidadeParcelas: existente?.cobrancaRecorrente?.quantidadeParcelas || null, formaPagamento: existente?.cobrancaRecorrente?.formaPagamento || null } : (existente?.cobrancaRecorrente || null),
      };
      if (existente) await atualizarDoc('clientes', existente.id, dados);
      else await criarDoc('clientes', { ...dados, tipoCobranca:'MENSALIDADE', ativo:true, etapaAtual: null, createdAt: new Date().toISOString() });
    }
    setImportando(false);
  }

  return (
    <div className="spage">
      <div className="toolbar" style={{marginBottom:14}}>
        {podeEditar(usuario) && <button className="btn btn-g btn-sm" onClick={()=>setModalNovo(true)}>+ Novo cliente</button>}
        {podeEditar(usuario) && <button className="btn btn-s btn-sm" onClick={()=>setImportando(true)}>Importar CSV</button>}
        <label style={{fontSize:12,display:'flex',alignItems:'center',gap:6,marginLeft:'auto'}}>
          <input type="checkbox" checked={mostrarInativos} onChange={e=>setMostrarInativos(e.target.checked)} /> Mostrar inativos
        </label>
      </div>
      <table className="tbl">
        <thead><tr><th>Código</th><th>Nome</th><th>Carteira</th><th>Tipo</th><th>Status</th><th></th></tr></thead>
        <tbody>
          {filtrados.filter(c => mostrarInativos || c.ativo !== false).map(c => (
            <tr key={c.id} style={{cursor:'pointer', opacity: c.ativo===false?0.5:1}} onClick={()=>onAbrirCliente(c)}>
              <td>{c.codigo}</td><td>{c.nome}</td><td>{c.carteira||'—'}</td>
              <td>{c.tipoCobranca==='EXITO'?'Honorários de êxito':'Mensalidade'}</td>
              <td>{c.ativo===false ? <span className="badge b-r">Inativo</span> : (c.etapaAtual ? ETAPA_CURTO[c.etapaAtual] : 'Em dia')}</td>
              <td onClick={e=>e.stopPropagation()}>
                {podeEditar(usuario) && <button className="btn btn-s btn-xs" onClick={()=>setEditando(c)}>Editar</button>}
                {podeEditar(usuario) && <button className="btn btn-d btn-xs" style={{marginLeft:6}} onClick={(e)=>excluirCliente(c,e)} disabled={excluindo===c.id} title="Excluir cliente">{excluindo===c.id?'...':'🗑️'}</button>}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      {filtrados.length===0 && <div className="empty">Nenhum cliente cadastrado.</div>}
      {modalNovo && <ClienteFormModal config={config} onClose={()=>setModalNovo(false)} onSalvar={salvar} />}
      {editando && <ClienteFormModal cliente={editando} config={config} onClose={()=>setEditando(null)} onSalvar={salvar} />}
      {importando && <ImportarCsvModal onClose={()=>setImportando(false)} onImportar={importar} />}
    </div>
  );
}

/* ===================================================================
   COBRANÇAS — visão geral de todas as cobranças (item 19).
   =================================================================== */
function ImportarCobrancasModal({ clientes, cobrancas, onClose, usuario }){
  const [texto, setTexto] = useState('codigo;nome;carteira;valor;vencimento;tipo\nC047;Beleza Natu Cosmeticos;Celeste;562,50;03/09/2026;Cobrança Avulsa');
  const [parsed, setParsed] = useState(null);
  const [mapeamento, setMapeamento] = useState({ codigo:'', nome:'', carteira:'', valor:'', vencimento:'', tipo:'' });
  const [importando, setImportando] = useState(false);
  const [resultado, setResultado] = useState(null);
  const [erro, setErro] = useState('');
  const [progresso, setProgresso] = useState(null);

  function detectarColunas(){
    const r = parseCsv(texto);
    setParsed(r);
    const auto = adivinharMapeamento(r.headers);
    const idxTipo = r.headers.findIndex(h => h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes('tipo'));
    setMapeamento({ ...auto, tipo: idxTipo>=0 ? r.headers[idxTipo] : '' });
  }

  // Datas brasileiras (DD/MM/AAAA) — o mesmo formato que sai do Asaas/Excel.
  function parseDataBR(str){
    const s = String(str || '').trim();
    const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
    const iso = new Date(s);
    return isNaN(iso) ? null : iso;
  }

  const preview = useMemo(() => {
    if (!parsed) return [];
    const idx = campo => parsed.headers.indexOf(mapeamento[campo]);
    const iCodigo = idx('codigo'), iNome = idx('nome'), iCarteira = idx('carteira'), iValor = idx('valor'), iVencimento = idx('vencimento'), iTipo = idx('tipo');
    return parsed.linhasDados.map(linha => {
      const vencStr = iVencimento>=0 ? linha[iVencimento] : '';
      const vencData = parseDataBR(vencStr);
      return {
        codigo: iCodigo>=0 ? linha[iCodigo] : '',
        nome: iNome>=0 ? linha[iNome] : '',
        carteira: iCarteira>=0 ? linha[iCarteira] : '',
        valor: iValor>=0 ? parseMoney(linha[iValor]) : 0,
        vencimentoStr: vencStr,
        vencimento: vencData,
        tipo: iTipo>=0 ? linha[iTipo] : '',
      };
    });
  }, [parsed, mapeamento]);

  const linhasComProblema = new Set();
  preview.forEach((p, i) => { if (!p.codigo || !p.valor || !p.vencimento) linhasComProblema.add(i); });
  const clientesNovos = new Set(preview.filter(p=>p.codigo && !clientes.some(c=>c.codigo===p.codigo)).map(p=>p.codigo));
  const podeImportar = parsed && mapeamento.codigo && mapeamento.valor && mapeamento.vencimento && preview.length > 0 && linhasComProblema.size === 0;

  const CAMPOS = [
    { key:'codigo', label:'Código (obrigatório)' },
    { key:'valor', label:'Valor (obrigatório)' },
    { key:'vencimento', label:'Vencimento — data DD/MM/AAAA (obrigatório)' },
    { key:'nome', label:'Nome (só usado se o cliente ainda não existir)' },
    { key:'carteira', label:'Carteira (só usado se o cliente ainda não existir)' },
    { key:'tipo', label:'Tipo de cobrança (opcional)' },
  ];

  async function importar(){
    setImportando(true);
    setErro('');
    let cobrancasCriadas = 0, clientesCriados = 0, puladas = 0;
    const recorrenteJaConfigurado = new Set();
    try {
      for (const [i, p] of preview.entries()) {
        if (!p.codigo || !p.valor || !p.vencimento) { puladas++; continue; }
        let cliente = clientes.find(c => c.codigo === p.codigo);
        if (!cliente) {
          const novoId = await criarDoc('clientes', {
            codigo: p.codigo, nome: p.nome || p.codigo, carteira: p.carteira || '', tipoCobranca: 'MENSALIDADE',
            ativo: true, etapaAtual: null, observacoes: '', createdAt: new Date().toISOString(),
          });
          cliente = { id: novoId, codigo: p.codigo };
          clientes.push(cliente); // pra próximas linhas do mesmo lote acharem sem duplicar
          clientesCriados++;
        }
        // Idempotência: reimportar o mesmo arquivo não duplica a cobrança
        // (mesmo cliente + mesmo vencimento + mesmo valor já existente = pula).
        const vencIso = p.vencimento.toISOString();
        const jaExiste = cobrancas.some(cb => cb.clienteId === cliente.id && cb.valor === p.valor && cb.vencimento && cb.vencimento.slice(0,10) === vencIso.slice(0,10))
          || (window.__cobrancasImportadasNesteLote || []).some(cb => cb.clienteId===cliente.id && cb.valor===p.valor && cb.vencimento.slice(0,10)===vencIso.slice(0,10));
        if (jaExiste) { puladas++; continue; }

        window.__cobrancasImportadasNesteLote = window.__cobrancasImportadasNesteLote || [];
        window.__cobrancasImportadasNesteLote.push({ clienteId: cliente.id, valor: p.valor, vencimento: vencIso });

        await criarDoc('cobrancas', {
          clienteId: cliente.id, valor: p.valor, competencia: competenciaDe(p.vencimento), vencimento: vencIso,
          dataPagamento: null, geradaAutomaticamente: false, criadoEm: new Date().toISOString(), criadoPor: usuario.nome,
        });
        cobrancasCriadas++;
        setProgresso({ atual: i+1, total: preview.length });

        // "Cobrança Recorrente" (assinatura em aberto, sem data final): monta
        // a recorrência automática do cliente uma vez, com o dia dessa cobrança.
        if (/recorrente/i.test(p.tipo) && !recorrenteJaConfigurado.has(cliente.id) && !(cliente.cobrancaRecorrente && cliente.cobrancaRecorrente.ativo)) {
          await atualizarDoc('clientes', cliente.id, {
            cobrancaRecorrente: { ativo: true, valor: p.valor, diaVencimento: p.vencimento.getDate(), periodicidade: 'MENSAL', dataInicial: null, dataFinal: null, quantidadeParcelas: null, formaPagamento: null },
          });
          recorrenteJaConfigurado.add(cliente.id);
        }
      }
      window.__cobrancasImportadasNesteLote = [];
      setResultado({ cobrancasCriadas, clientesCriados, puladas });
    } catch (err) {
      // Antes, um erro no meio do lote (ex.: regra do Firestore bloqueando
      // a escrita) parava tudo silenciosamente — sem nenhuma mensagem.
      // Agora mostra o que aconteceu e quanto já tinha sido importado até parar.
      console.error('Erro ao importar cobranças:', err);
      setErro(`Parou no meio da importação (${cobrancasCriadas} já criada(s) até aqui): ${err && err.message ? err.message : err}. Se a mensagem falar de permissão, confira a regra do Firestore.`);
    } finally {
      setImportando(false);
    }
  }

  return (
    <Modal titulo="Importar cobranças por CSV (com data real)" onClose={onClose} wide
      footer={<>
        <button className="btn btn-s" onClick={onClose}>{resultado ? 'Fechar' : 'Cancelar'}</button>
        {!resultado && <button className="btn btn-g" onClick={importar} disabled={!podeImportar || importando}>{importando?(progresso?`Importando... (${progresso.atual}/${progresso.total})`:'Importando...'):`Confirmar importação (${preview.length})`}</button>}
      </>}>
      <div className="mbody">
        {erro && (
          <div className="badge b-r" style={{display:'block',marginBottom:12,padding:'8px 10px'}}>{erro}</div>
        )}
        {resultado ? (
          <div>
            <p style={{fontSize:14,fontWeight:600,color:'var(--green)',marginBottom:8}}>Importação concluída.</p>
            <ul style={{fontSize:13,color:'var(--t2)',lineHeight:1.8}}>
              <li>{resultado.cobrancasCriadas} cobrança(s) criada(s)</li>
              <li>{resultado.clientesCriados} cliente(s) novo(s) cadastrado(s) automaticamente (código não existia ainda)</li>
              <li>{resultado.puladas} linha(s) pulada(s) (dado incompleto ou já importada antes — evita duplicar)</li>
            </ul>
          </div>
        ) : (
          <>
            <p style={{fontSize:12,color:'var(--t2)',marginBottom:8}}>
              Diferente do importador de Clientes, este cria cobranças de verdade (com data e valor reais) — várias linhas com o mesmo código são normais (parcelas/cobranças diferentes do mesmo cliente). Se o código ainda não existir, o cliente é cadastrado automaticamente. Reimportar o mesmo arquivo não duplica nada.
            </p>
            <textarea className="fi" style={{minHeight:140,fontFamily:'JetBrains Mono, monospace',fontSize:12}} value={texto} onChange={e=>{ setTexto(e.target.value); setParsed(null); }} />
            <button className="btn btn-s btn-sm" style={{marginTop:8}} onClick={detectarColunas}>Detectar colunas</button>

            {parsed && (
              <>
                <div className="fsec" style={{marginTop:16}}>Mapeamento de colunas {parsed.delimitador===';' ? '(separador: ;)' : '(separador: ,)'}</div>
                <div className="fr">
                  {CAMPOS.map(c => (
                    <div className="fg" key={c.key}>
                      <label className="fl">{c.label}</label>
                      <select className="fs" value={mapeamento[c.key]} onChange={e=>setMapeamento({...mapeamento, [c.key]: e.target.value})}>
                        <option value="">— não importar —</option>
                        {parsed.headers.map(h => <option key={h} value={h}>{h}</option>)}
                      </select>
                    </div>
                  ))}
                </div>

                {!mapeamento.codigo || !mapeamento.valor || !mapeamento.vencimento ? (
                  <p style={{fontSize:12,color:'var(--red)',marginTop:8}}>Selecione pelo menos Código, Valor e Vencimento.</p>
                ) : linhasComProblema.size > 0 ? (
                  <p style={{fontSize:12,color:'var(--red)',marginTop:8}}>{linhasComProblema.size} linha(s) com código, valor ou vencimento inválido/em branco — destacadas abaixo.</p>
                ) : (
                  <p style={{fontSize:12,color:'var(--green)',marginTop:8}}>Tudo certo — {preview.length} cobrança(s), sendo {clientesNovos.size} cliente(s) novo(s).</p>
                )}

                <div className="fsec" style={{marginTop:12}}>Prévia</div>
                <div style={{maxHeight:280,overflowY:'auto'}}>
                  <table className="tbl">
                    <thead><tr><th>Código</th><th>Nome</th><th>Carteira</th><th>Valor</th><th>Vencimento</th><th>Tipo</th></tr></thead>
                    <tbody>
                      {preview.map((p,i)=>(
                        <tr key={i} style={linhasComProblema.has(i) ? { background:'var(--redl)' } : (clientesNovos.has(p.codigo) ? { background:'var(--green-bg)' } : undefined)}>
                          <td>{p.codigo || '—'}</td><td>{p.nome || '—'}</td><td>{p.carteira || '—'}</td>
                          <td>{p.valor ? fmtMoney(p.valor) : '—'}</td>
                          <td>{p.vencimento ? fmtDate(p.vencimento) : (p.vencimentoStr || '—')}</td>
                          <td>{p.tipo || '—'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </>
            )}
          </>
        )}
      </div>
    </Modal>
  );
}

function CobrancasView({ clientes, cobrancas, usuario, busca }){
  const [filtroStatus, setFiltroStatus] = useState('');
  const [dataDe, setDataDe] = useState('');
  const [dataAte, setDataAte] = useState('');
  const [importando, setImportando] = useState(false);
  const hoje = hojeSemHora();
  const nomePorCliente = Object.fromEntries(clientes.map(c=>[c.id, c]));
  const linhas = cobrancas
    .map(c => ({ ...c, cliente: nomePorCliente[c.clienteId], statusCalc: statusCobranca(c, hoje) }))
    .filter(c => c.cliente)
    .filter(c => !busca || `${c.cliente.nome} ${c.cliente.codigo}`.toLowerCase().includes(busca.toLowerCase()))
    .filter(c => !filtroStatus || c.statusCalc.status === filtroStatus)
    // Filtro por data (vencimento) — item pedido: "de" e "até".
    .filter(c => !dataDe || toDate(c.vencimento) >= new Date(dataDe+'T00:00:00'))
    .filter(c => !dataAte || toDate(c.vencimento) <= new Date(dataAte+'T23:59:59'))
    .sort((a,b)=> toDate(b.vencimento) - toDate(a.vencimento));

  async function pagar(c){ await atualizarDoc('cobrancas', c.id, { dataPagamento: new Date().toISOString() }); }
  async function excluir(c){
    if (!confirm(`Excluir a cobrança de ${c.cliente.nome} (${fmtMoney(c.valor)}, vence ${fmtDate(c.vencimento)})? Essa ação não pode ser desfeita.`)) return;
    await excluirDoc('cobrancas', c.id);
  }

  return (
    <div className="spage">
      <div className="toolbar" style={{marginBottom:14}}>
        <select className="fsel" value={filtroStatus} onChange={e=>setFiltroStatus(e.target.value)}>
          <option value="">Todos os status</option>
          <option value="PENDENTE">Pendente (não vencida)</option>
          <option value="ATRASADA">Atrasada</option>
          <option value="PAGA">Paga</option>
        </select>
        <label className="fl" style={{margin:'0 0 0 4px'}}>Vencimento de:</label>
        <input className="fsel" type="date" value={dataDe} onChange={e=>setDataDe(e.target.value)} />
        <label className="fl" style={{margin:0}}>até:</label>
        <input className="fsel" type="date" value={dataAte} onChange={e=>setDataAte(e.target.value)} />
        {(dataDe || dataAte) && <button className="btn btn-s btn-xs" onClick={()=>{setDataDe('');setDataAte('');}}>Limpar datas</button>}
        {podeEditar(usuario) && <button className="btn btn-s btn-sm" style={{marginLeft:'auto'}} onClick={()=>setImportando(true)}>Importar cobranças (CSV)</button>}
      </div>
      <table className="tbl">
        <thead><tr><th>Cliente</th><th>Competência</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Observação</th><th></th></tr></thead>
        <tbody>
          {linhas.map(c => (
            <tr key={c.id}>
              <td>{c.cliente.nome} ({c.cliente.codigo})</td>
              <td>{c.competencia||'—'}</td>
              <td>{fmtMoney(c.valor)}</td>
              <td>{fmtDate(c.vencimento)}</td>
              <td>
                {c.dataPagamento ? <span className="badge b-g">Paga em {fmtDate(c.dataPagamento)}</span>
                  : c.statusCalc.status==='ATRASADA' ? <span className="badge b-r">{c.statusCalc.diasAtraso}d de atraso</span>
                  : <span className="badge b-b">Pendente</span>}
              </td>
              <td><ObservacaoCobranca cobranca={c} editar={podeEditar(usuario)} /></td>
              <td>
                {podeEditar(usuario) && !c.dataPagamento && <button className="btn btn-g btn-xs" onClick={()=>pagar(c)}>Marcar paga</button>}
                {podeEditar(usuario) && <button className="btn btn-d btn-xs" style={{marginLeft:6}} onClick={()=>excluir(c)} title="Excluir cobrança">🗑️</button>}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      {linhas.length===0 && <div className="empty">Nenhuma cobrança encontrada.</div>}
      {importando && <ImportarCobrancasModal clientes={clientes} cobrancas={cobrancas} usuario={usuario} onClose={()=>setImportando(false)} />}
    </div>
  );
}

/* ===================================================================
   TAREFAS — lista geral (item 8, com os mesmos filtros do pedido).
   =================================================================== */
function TarefasView({ clientes, tarefas, usuario, busca }){
  const [filtros, setFiltros] = useState({ status:'', responsavel:'', atrasadas:false });
  const hoje = hojeSemHora();
  const nomePorCliente = Object.fromEntries(clientes.map(c=>[c.id, c]));
  const responsaveisSet = [...new Set(tarefas.map(t=>t.responsavel).filter(Boolean))];

  const linhas = tarefas
    .map(t => ({ ...t, cliente: nomePorCliente[t.clienteId], atrasada: t.status==='PENDENTE' && diffDays(t.prazo,hoje)>0 }))
    .filter(t => t.cliente)
    .filter(t => !busca || `${t.cliente.nome} ${t.cliente.codigo}`.toLowerCase().includes(busca.toLowerCase()))
    .filter(t => !filtros.status || t.status === filtros.status)
    .filter(t => !filtros.responsavel || t.responsavel === filtros.responsavel)
    .filter(t => !filtros.atrasadas || t.atrasada)
    .sort((a,b)=> (a.status==='PENDENTE'?0:1)-(b.status==='PENDENTE'?0:1) || toDate(a.prazo)-toDate(b.prazo));

  async function concluir(t){ await atualizarDoc('tarefas', t.id, { status:'CONCLUIDA', dataConclusao:new Date().toISOString() }); }

  return (
    <div className="spage">
      <div className="toolbar" style={{marginBottom:14}}>
        <select className="fsel" value={filtros.status} onChange={e=>setFiltros({...filtros,status:e.target.value})}>
          <option value="">Todos os status</option><option value="PENDENTE">Pendente</option><option value="CONCLUIDA">Concluída</option>
        </select>
        <select className="fsel" value={filtros.responsavel} onChange={e=>setFiltros({...filtros,responsavel:e.target.value})}>
          <option value="">Todos os responsáveis</option>
          {responsaveisSet.map(r=><option key={r} value={r}>{r}</option>)}
        </select>
        <label style={{fontSize:12,display:'flex',alignItems:'center',gap:6}}>
          <input type="checkbox" checked={filtros.atrasadas} onChange={e=>setFiltros({...filtros,atrasadas:e.target.checked})} /> Só atrasadas
        </label>
      </div>
      <div className="tlist">
        {linhas.map(t => (
          <div key={t.id} className={`titem ${t.atrasada?'ov2':''}`}>
            {podeEditar(usuario) && t.status==='PENDENTE' && <button className="tcheck" onClick={()=>concluir(t)}></button>}
            <div>
              <div style={{fontWeight:500}}>{t.descricao}</div>
              <div style={{color:'var(--t2)'}}>{t.cliente.nome} ({t.cliente.codigo}) · {t.responsavel} · prazo {fmtDate(t.prazo)}{t.atrasada?` · ⚠️ atrasada há ${diffDays(t.prazo,hoje)}d`:''}</div>
            </div>
            <span className="badge b-b" style={{marginLeft:'auto'}}>{t.status==='CONCLUIDA'?'Concluída':'Pendente'}</span>
          </div>
        ))}
        {linhas.length===0 && <div className="empty">Nenhuma tarefa encontrada.</div>}
      </div>
    </div>
  );
}

/* ===================================================================
   DASHBOARD FINANCEIRO (itens 14-16 do pedido).
   =================================================================== */
function BarChart({ dados, cor }){
  const max = Math.max(1, ...dados.map(d=>d.valor));
  return (
    <div className="bar-chart">
      {dados.map((d,i) => (
        <div className="bg" key={i}>
          <div className="bval">{d.valor>=1000 ? `${(d.valor/1000).toFixed(1)}k` : Math.round(d.valor)}</div>
          <div className="bar" style={{height:`${Math.max(3,(d.valor/max)*90)}px`, background: cor||'var(--green)'}} />
          <div className="blbl">{d.label}</div>
        </div>
      ))}
    </div>
  );
}

function ultimosMeses(n){
  const hoje = hojeSemHora();
  const arr = [];
  for (let i=n-1;i>=0;i--) {
    const d = addMonths(new Date(hoje.getFullYear(), hoje.getMonth(), 1), -i);
    arr.push({ competencia: competenciaDe(d), label: d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','') });
  }
  return arr;
}

function DashboardView({ clientes, cobrancas, config, usuario }){
  const hoje = hojeSemHora();
  const [competencia, setCompetencia] = useState(competenciaDe(hoje));
  const [carteiraFiltro, setCarteiraFiltro] = useState('');
  const [gerando, setGerando] = useState(false);
  const [msg, setMsg] = useState('');

  const carteiras = config.carteiras || CARTEIRAS_PADRAO;
  const nomePorCliente = Object.fromEntries(clientes.map(c=>[c.id,c]));
  const pertenceAoFiltro = c => !carteiraFiltro || nomePorCliente[c.clienteId]?.carteira === carteiraFiltro;

  // Item 2 da ata: filtro por mês/ano e por carteira ("visão geral" = sem filtro).
  const doMes = cobrancas.filter(c => c.competencia === competencia && pertenceAoFiltro(c));
  const [anoComp, mesComp] = competencia.split('-').map(Number);
  const competenciaAnterior = competenciaDe(new Date(anoComp, mesComp-2, 1));
  const doMesAnterior = cobrancas.filter(c => c.competencia === competenciaAnterior && pertenceAoFiltro(c));

  function totais(lista){
    const receita = lista.reduce((s,c)=>s+Number(c.valor),0);
    const recebido = lista.filter(c=>c.dataPagamento).reduce((s,c)=>s+Number(c.valor),0);
    const vencido = lista.filter(c=>!c.dataPagamento && diffDays(c.vencimento,hoje)>0).reduce((s,c)=>s+Number(c.valor),0);
    const emAberto = lista.filter(c=>!c.dataPagamento && diffDays(c.vencimento,hoje)<=0).reduce((s,c)=>s+Number(c.valor),0);
    return { receita, recebido, vencido, emAberto };
  }
  const atual = totais(doMes);
  const anterior = totais(doMesAnterior);
  const inadimplente = atual.vencido;
  const percInadimplencia = atual.receita>0 ? (inadimplente/atual.receita*100) : 0;
  function comparativo(a, b){ if (!b) return null; const d = a-b; const pct = b!==0 ? (d/b*100) : (a>0?100:0); return { d, pct }; }

  // "Valor perdido/deixado de receber" (item 2): soma das cobranças em
  // aberto de clientes já em Rescisão/Notificação/Jurídico — dinheiro
  // que dificilmente volta, olhando a base toda (não só o mês).
  const clientesPerdidos = clientes.filter(c => ['RESCISAO','NOTIFICACAO','JURIDICO'].includes(c.etapaAtual) && pertenceAoFiltro({clienteId:c.id}));
  const idsPerdidos = new Set(clientesPerdidos.map(c=>c.id));
  const valorPerdido = cobrancas.filter(c => idsPerdidos.has(c.clienteId) && !c.dataPagamento).reduce((s,c)=>s+Number(c.valor),0);

  const porCarteira = carteiras.map(cart => {
    const cobsCarteira = cobrancas.filter(c => c.competencia===competencia && nomePorCliente[c.clienteId]?.carteira === cart);
    const t = totais(cobsCarteira);
    return { carteira:cart, receita:t.receita, recebido:t.recebido, vencido:t.vencido, inadimplente:t.vencido, pct: t.receita>0?(t.vencido/t.receita*100):0 };
  });
  const totalCarteiras = porCarteira.reduce((acc,c)=>({ receita:acc.receita+c.receita, recebido:acc.recebido+c.recebido, vencido:acc.vencido+c.vencido }), {receita:0,recebido:0,vencido:0});

  const meses = ultimosMeses(6);
  const inadimplenciaMensal = meses.map(m => {
    const cobs = cobrancas.filter(c=>c.competencia===m.competencia && pertenceAoFiltro(c));
    const fat = cobs.reduce((s,c)=>s+Number(c.valor),0);
    const receb = cobs.filter(c=>c.dataPagamento).reduce((s,c)=>s+Number(c.valor),0);
    return { label:m.label, valor: Math.max(0, fat-receb) };
  });
  let acumulado = 0;
  const inadimplenciaAcumulada = inadimplenciaMensal.map(m => { acumulado += m.valor; return { label:m.label, valor:acumulado }; });
  const receitaMensal = meses.map(m => ({ label:m.label, valor: cobrancas.filter(c=>c.competencia===m.competencia && pertenceAoFiltro(c)).reduce((s,c)=>s+Number(c.valor),0) }));
  const recebidoMensal = meses.map(m => ({ label:m.label, valor: cobrancas.filter(c=>c.competencia===m.competencia && c.dataPagamento && pertenceAoFiltro(c)).reduce((s,c)=>s+Number(c.valor),0) }));

  async function gerar(){
    setGerando(true);
    const n = await gerarCobrancasRecorrentes(clientes, cobrancas, usuario.nome);
    setMsg(n>0 ? `${n} cobrança(s) recorrente(s) gerada(s).` : 'Nenhuma cobrança nova pra gerar agora.');
    setGerando(false);
    setTimeout(()=>setMsg(''), 4000);
  }

  function Delta({ cmp }){
    if (!cmp) return null;
    const bom = cmp.d <= 0;
    return <div className="kpi-s" style={{color: bom?'var(--green)':'var(--red)'}}>{cmp.d>=0?'▲':'▼'} {Math.abs(cmp.pct).toFixed(1)}% vs {competenciaAnterior}</div>;
  }

  return (
    <div className="dash">
      <div className="toolbar" style={{marginBottom:14,padding:0}}>
        <label className="fl" style={{margin:0}}>Competência:</label>
        <input className="fsel" type="month" value={competencia} onChange={e=>setCompetencia(e.target.value)} />
        <select className="fsel" value={carteiraFiltro} onChange={e=>setCarteiraFiltro(e.target.value)}>
          <option value="">Visão geral (todas as carteiras)</option>
          {carteiras.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <div style={{marginLeft:'auto'}}>
          {podeEditar(usuario) && <button className="btn btn-s btn-sm" onClick={gerar} disabled={gerando}>{gerando?'Gerando...':'Gerar cobranças recorrentes pendentes'}</button>}
        </div>
      </div>
      {msg && <div className="badge b-b" style={{display:'block',marginBottom:12,padding:'6px 10px'}}>{msg}</div>}

      <div className="kgrid">
        <div className="kpi b"><div className="kpi-l">Receita de mensalidades</div><div className="kpi-v">{fmtMoney(atual.receita)}</div><Delta cmp={comparativo(atual.receita, anterior.receita)} /></div>
        <div className="kpi g"><div className="kpi-l">Recebido</div><div className="kpi-v">{fmtMoney(atual.recebido)}</div><Delta cmp={comparativo(atual.recebido, anterior.recebido)} /></div>
        <div className="kpi o"><div className="kpi-l">Em aberto</div><div className="kpi-v">{fmtMoney(atual.emAberto)}</div></div>
        <div className="kpi r"><div className="kpi-l">Vencido</div><div className="kpi-v">{fmtMoney(atual.vencido)}</div><Delta cmp={comparativo(atual.vencido, anterior.vencido)} /></div>
        <div className="kpi r"><div className="kpi-l">Inadimplente</div><div className="kpi-v">{fmtMoney(inadimplente)}</div></div>
        <div className="kpi p"><div className="kpi-l">% Inadimplência</div><div className="kpi-v">{percInadimplencia.toFixed(1)}%</div></div>
        <div className="kpi p"><div className="kpi-l">Perdido (Rescisão/Notif./Jurídico)</div><div className="kpi-v">{fmtMoney(valorPerdido)}</div><div className="kpi-s">{clientesPerdidos.length} cliente(s)</div></div>
      </div>

      <div className="cc" style={{marginBottom:16}}>
        <div className="ct">Inadimplência por carteira</div>
        <table className="tbl">
          <thead><tr><th>Carteira</th><th>Receita</th><th>Recebido</th><th>Vencido</th><th>Inadimplente</th><th>%</th></tr></thead>
          <tbody>
            {porCarteira.map(c => (
              <tr key={c.carteira}><td>{c.carteira}</td><td>{fmtMoney(c.receita)}</td><td>{fmtMoney(c.recebido)}</td><td>{fmtMoney(c.vencido)}</td><td>{fmtMoney(c.inadimplente)}</td><td>{c.pct.toFixed(1)}%</td></tr>
            ))}
            <tr style={{fontWeight:700,background:'var(--body)'}}>
              <td>Total</td><td>{fmtMoney(totalCarteiras.receita)}</td><td>{fmtMoney(totalCarteiras.recebido)}</td><td>{fmtMoney(totalCarteiras.vencido)}</td><td>{fmtMoney(totalCarteiras.vencido)}</td>
              <td>{totalCarteiras.receita>0?(totalCarteiras.vencido/totalCarteiras.receita*100).toFixed(1):'0.0'}%</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div className="cgrid">
        <div className="cc"><div className="ct">Inadimplência mensal</div><BarChart dados={inadimplenciaMensal} cor="var(--red)" /></div>
        <div className="cc"><div className="ct">Inadimplência acumulada</div><BarChart dados={inadimplenciaAcumulada} cor="var(--orange)" /></div>
        <div className="cc"><div className="ct">Inadimplência por carteira (mês atual)</div><BarChart dados={porCarteira.map(c=>({label:c.carteira,valor:c.vencido}))} cor="var(--purple)" /></div>
        <div className="cc"><div className="ct">Receita de mensalidades</div><BarChart dados={receitaMensal} cor="var(--blue)" /></div>
      </div>
      <div className="cc">
        <div className="ct">Recebido × Vencido (últimos 6 meses)</div>
        <div style={{display:'flex',gap:20}}>
          <div style={{flex:1}}><div style={{fontSize:11,color:'var(--t2)',marginBottom:4}}>Recebido</div><BarChart dados={recebidoMensal} cor="var(--green)" /></div>
          <div style={{flex:1}}><div style={{fontSize:11,color:'var(--t2)',marginBottom:4}}>Vencido</div><BarChart dados={inadimplenciaMensal} cor="var(--red)" /></div>
        </div>
      </div>
    </div>
  );
}

/* ===================================================================
   CONFIGURAÇÕES — responsáveis por etapa (item 9, editável, nunca
   hardcoded), carteiras e usuários/permissões (item 22).
   =================================================================== */
function ConfiguracoesView({ config, usuarios }){
  const [responsaveis, setResponsaveis] = useState(config.responsaveis || RESPONSAVEIS_PADRAO);
  const [carteiras, setCarteiras] = useState((config.carteiras || CARTEIRAS_PADRAO).join(', '));
  const [novaCarteira, setNovaCarteira] = useState('');
  const [novoUsuario, setNovoUsuario] = useState({ nome:'', email:'', senha:'', perfil:'OPERACIONAL' });
  const [criando, setCriando] = useState(false);
  const [erroUsuario, setErroUsuario] = useState('');

  async function salvarResponsaveis(){ await salvarConfig({ responsaveis }); }
  async function salvarCarteiras(){ await salvarConfig({ carteiras: carteiras.split(',').map(s=>s.trim()).filter(Boolean) }); }

  async function criarUsuario(){
    if (!novoUsuario.nome.trim()) return;
    setErroUsuario('');
    if (!firebaseOk) {
      // Modo local: sem senha, mesmo comportamento simples de sempre.
      await criarDoc('usuarios', { nome: novoUsuario.nome, perfil: novoUsuario.perfil, criadoEm: new Date().toISOString() });
      setNovoUsuario({ nome:'', email:'', senha:'', perfil:'OPERACIONAL' });
      return;
    }
    // Modo Firebase: cria a conta de autenticação (e-mail/senha) num app
    // secundário — pra não trocar a sessão de quem está logado agora —
    // e grava o perfil (nome/perfil) usando a conexão principal, que
    // continua autenticada como o administrador.
    if (!novoUsuario.email.trim() || novoUsuario.senha.length < 6) {
      setErroUsuario('Preencha e-mail e uma senha de pelo menos 6 caracteres.');
      return;
    }
    setCriando(true);
    try {
      const cred = await authSecundario.createUserWithEmailAndPassword(novoUsuario.email.trim(), novoUsuario.senha);
      await db.collection('usuarios').doc(cred.user.uid).set({
        nome: novoUsuario.nome, email: novoUsuario.email.trim(), perfil: novoUsuario.perfil, criadoEm: new Date().toISOString(),
      });
      await authSecundario.signOut(); // limpa a sessão do app secundário, não afeta a sua
      setNovoUsuario({ nome:'', email:'', senha:'', perfil:'OPERACIONAL' });
    } catch (err) {
      setErroUsuario(mensagemErroAuth(err));
    } finally {
      setCriando(false);
    }
  }

  async function removerUsuario(id){
    // Só remove o PERFIL (usuarios/{id}) — sem um back-end (Admin SDK),
    // o app não consegue apagar a conta de autenticação de outra pessoa
    // pelo navegador. Sem o perfil, a próxima tentativa de login dessa
    // pessoa é bloqueada automaticamente (ver onAuthStateChanged no App).
    await excluirDoc('usuarios', id);
  }

  return (
    <div className="spage">
      <div className="scard">
        <div className="ct">Responsáveis por etapa (item 9)</div>
        <p style={{fontSize:12,color:'var(--t2)',marginBottom:12}}>Editável a qualquer momento — nada aqui fica travado no código.</p>
        <div className="fr">
          {ETAPAS.filter(e=>e.key!=='REGULARIZADO').map(e => (
            <div className="fg" key={e.key}>
              <label className="fl">{e.label}</label>
              <input className="fi" value={responsaveis[e.key]||''} onChange={ev=>setResponsaveis({...responsaveis,[e.key]:ev.target.value})} />
            </div>
          ))}
        </div>
        <button className="btn btn-g btn-sm" onClick={salvarResponsaveis}>Salvar responsáveis</button>
      </div>

      <div className="scard">
        <div className="ct">Carteiras / equipes</div>
        <div className="fg"><label className="fl">Separadas por vírgula</label><input className="fi" value={carteiras} onChange={e=>setCarteiras(e.target.value)} /></div>
        <button className="btn btn-g btn-sm" onClick={salvarCarteiras}>Salvar carteiras</button>
      </div>

      <div className="scard">
        <div className="ct">Usuários e permissões (item 22)</div>
        {!firebaseOk && (
          <p style={{fontSize:12,color:'var(--t2)',marginBottom:12}}>Modo local: sem senha (só pra testar). No modo Firebase, cada usuário tem e-mail e senha de verdade.</p>
        )}
        <table className="tbl" style={{marginBottom:14}}>
          <thead><tr><th>Nome</th>{firebaseOk && <th>E-mail</th>}<th>Perfil</th><th></th></tr></thead>
          <tbody>
            {usuarios.map(u => (
              <tr key={u.id}><td>{u.nome}</td>{firebaseOk && <td>{u.email || '—'}</td>}<td>{PERFIS[u.perfil]}</td>
                <td><button className="btn btn-s btn-xs" onClick={()=>removerUsuario(u.id)}>Remover</button></td></tr>
            ))}
          </tbody>
        </table>
        <div className="fr">
          <div className="fg"><label className="fl">Nome</label><input className="fi" value={novoUsuario.nome} onChange={e=>setNovoUsuario({...novoUsuario,nome:e.target.value})} /></div>
          {firebaseOk && (
            <>
              <div className="fg"><label className="fl">E-mail</label><input className="fi" type="email" value={novoUsuario.email} onChange={e=>setNovoUsuario({...novoUsuario,email:e.target.value})} /></div>
              <div className="fg"><label className="fl">Senha (mín. 6 caracteres)</label><input className="fi" type="password" value={novoUsuario.senha} onChange={e=>setNovoUsuario({...novoUsuario,senha:e.target.value})} /></div>
            </>
          )}
          <div className="fg"><label className="fl">Perfil</label>
            <select className="fs" value={novoUsuario.perfil} onChange={e=>setNovoUsuario({...novoUsuario,perfil:e.target.value})}>
              {Object.entries(PERFIS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
            </select>
          </div>
        </div>
        {erroUsuario && <p style={{fontSize:12,color:'var(--red)',marginBottom:8}}>{erroUsuario}</p>}
        <button className="btn btn-g btn-sm" onClick={criarUsuario} disabled={criando}>{criando?'Criando...':'Adicionar usuário'}</button>
      </div>
    </div>
  );
}

/* ===================================================================

   usar no dia a dia (Duda/Larissa), não pra quem programou.

const MANUAL_SECOES = [
  { id:'visao-geral', titulo:'Visão geral' },
  { id:'kanban', titulo:'CRM (Kanban)' },
  { id:'clientes', titulo:'Clientes' },
  { id:'cobrancas', titulo:'Cobranças' },
  { id:'tarefas', titulo:'Tarefas' },
  { id:'dashboard', titulo:'Dashboard' },
  { id:'config', titulo:'Configurações' },
  { id:'dia-a-dia', titulo:'Rotina do dia a dia' },
  { id:'duvidas', titulo:'Dúvidas frequentes' },
];

function ManualView(){
  const [ativo, setAtivo] = useState('visao-geral');
  const contentRef = useRef(null);

  function irPara(id){
    setAtivo(id);
    const el = window.document.getElementById('man-'+id);
    if (!el || !contentRef.current) return;
    const topo = el.offsetTop - 12;
    if (typeof contentRef.current.scrollTo === 'function') contentRef.current.scrollTo({ top: topo, behavior: 'smooth' });
    else contentRef.current.scrollTop = topo;
  }

  return (
    <div className="man-wrap">
      <div className="man-toc">
        {MANUAL_SECOES.map(s => (
          <a key={s.id} className={ativo===s.id?'ativo':''} onClick={()=>irPara(s.id)}>{s.titulo}</a>
        ))}
      </div>
      <div className="man-content" ref={contentRef}>

        <div className="man-sec" id="man-visao-geral">
          <h2>Visão geral</h2>
          <p className="man-sub">O que é este sistema e como ele se encaixa no dia a dia da cobrança.</p>
          <p>O <b>CRM Financeiro</b> serve pra acompanhar as mensalidades dos clientes e o processo de cobrança de quem está atrasado, do início ao fim — desde o lembrete antes do vencimento até a rescisão, notificação extrajudicial ou jurídico, se chegar nesse ponto.</p>
          <p>Ele tem 6 áreas, no menu à esquerda:</p>
          <ul>
            <li><b>CRM (Kanban)</b> — o painel principal, com um cartão pra cada cliente em atraso, organizado por etapa da cobrança.</li>
            <li><b>Clientes</b> — cadastro de todos os clientes (em dia ou não).</li>
            <li><b>Cobranças</b> — todas as cobranças lançadas, de todo mundo, numa lista só.</li>
            <li><b>Tarefas</b> — lembretes de ação (ligar, mandar mensagem, etc.), automáticos ou criados na mão.</li>
            <li><b>Dashboard</b> — números e gráficos: quanto está sendo recebido, quanto está em atraso, etc.</li>
            <li><b>Configurações</b> — só pra Administrador: responsáveis por etapa, carteiras, usuários.</li>
          </ul>
          <div className="man-tip">💡 O sistema salva tudo automaticamente, na hora. Não existe botão de "salvar tudo" no final — cada campo salva sozinho quando você confirma ele.</div>
        </div>

        <div className="man-sec" id="man-kanban">
          <h2>CRM (Kanban)</h2>
          <p className="man-sub">O coração do sistema: onde cada cliente atrasado aparece e avança sozinho.</p>
          <h3>Como funciona o funil</h3>
          <p>Cada cliente com uma cobrança vencida (ou perto de vencer) aparece como um <b>cartão</b>, numa das colunas: D-7, D-1, D0, D+1, D+2, D+5, D+7, D+10, D+15, D+20, Rescisão, Notificação, Jurídico. O nome da coluna é a quantidade de dias antes/depois do vencimento.</p>
          <div className="man-step"><b>O cliente muda de coluna sozinho</b>, conforme os dias passam — ninguém precisa arrastar nada no dia a dia. O sistema confere isso automaticamente quando alguém abre o Kanban, e também dá pra forçar clicando em <span className="man-kbd">🔄 Sincronizar etapas com a data de hoje</span>.</div>
          <p>Quando o cliente paga a cobrança em aberto, ele some das colunas de atraso e aparece na área <b>"Regularizados"</b>, embaixo do quadro.</p>
          <p>O responsável padrão de cada etapa aparece direto no <b>topo da coluna</b>, além de dentro de cada cartão. Do D-1 ao D+1 é o Financeiro, D-7/D+2/D+5 são do Líder, e de D+7 em diante (inclusive Notificação e Rescisão) é da Duda.</p>
          <h3>Mexendo manualmente</h3>
          <p>Dá pra arrastar um cartão pra outra coluna, ou abrir o cliente e trocar a etapa no seletor "Etapa do funil". Quando você faz isso na mão, o cliente fica <b>🔒 travado manualmente</b> — o sistema para de mover ele sozinho, pra não brigar com a sua decisão. Pra devolver ao automático, é só clicar em "Devolver ao automático" na ficha do cliente.</p>
          <div className="man-tip">💡 Use a trava manual pra casos especiais: cliente negociando, caso jurídico específico, etc. Pro dia a dia normal, deixe no automático.</div>
          <h3>O que cada cartão mostra</h3>
          <ul>
            <li>Nome e código do cliente, carteira</li>
            <li>Valor da cobrança em aberto e data de vencimento</li>
            <li>Responsável pela etapa atual (vem de Configurações)</li>
            <li>Próxima ação e quando ela vence</li>
            <li>Tag <b>"Em atraso"</b> (menos de 30 dias) ou <b>"Inadimplente"</b> (30 dias ou mais)</li>
            <li>Borda vermelha e aviso ⚠️ quando alguma tarefa dele está atrasada</li>
          </ul>
          <h3>Filtros</h3>
          <p>No topo do Kanban dá pra filtrar por carteira, responsável, status (em dia / atraso / inadimplente) e "com tarefa atrasada" — combine quantos quiser.</p>
          <h3>Exceção: honorário de êxito</h3>
          <p>Cliente cadastrado com tipo de cobrança <b>"Honorários de êxito"</b> nunca entra nesse funil de mensalidade — ele é uma cobrança diferente, sem prazo de rescisão automático.</p>
        </div>

        <div className="man-sec" id="man-clientes">
          <h2>Clientes</h2>
          <p className="man-sub">Cadastro de todo mundo — em dia, atrasado ou já regularizado.</p>
          <h3>Cadastrar um cliente na mão</h3>
          <ol>
            <li>Clique em <b>+ Novo cliente</b></li>
            <li>Preencha Código (obrigatório, é o identificador único — não pode repetir), Nome, Carteira e Tipo de cobrança</li>
            <li>Salvar</li>
          </ol>
          <p>Depois de criado, abra o cliente pra configurar a mensalidade dele — isso fica dentro da ficha, na aba <b>Cobrança</b> (veja a seção "Cobranças" abaixo).</p>
          <p>Na aba <b>Informações</b> da ficha (ou já no cadastro) dá pra colar o <b>link da conversa no ChatGuru</b> daquele cliente. Uma vez salvo, o link aparece clicável tanto na ficha quanto no próprio cartão do Kanban, abrindo a conversa direto.</p>
          <h3>Importar vários clientes de uma vez (CSV)</h3>
          <ol>
            <li>Clique em <b>Importar CSV</b></li>
            <li>Cole os dados (do Excel, do Asaas, de onde for) — funciona com vírgula ou ponto-e-vírgula separando as colunas</li>
            <li>Clique em <b>Detectar colunas</b></li>
            <li>Confira o mapeamento — o sistema tenta adivinhar sozinho qual coluna é qual, mas confira antes de confirmar</li>
            <li>Se aparecer aviso de linha com problema (código ou nome faltando, ou código repetido no arquivo), corrija na planilha e cole de novo</li>
            <li><b>Confirmar importação</b></li>
          </ol>
          <div className="man-warn">⚠️ O <b>código</b> é o identificador único. Se você reimportar um arquivo com um código que já existe, o sistema <b>atualiza</b> o cliente em vez de duplicar — e campos deixados em branco na planilha não apagam o que já estava cadastrado.</div>
          <h3>Cliente inativo (saiu da base)</h3>
          <p>Quando um cliente cancela e sai da base, abra a ficha dele → aba Informações → <b>Encerrar cliente</b>. Isso desativa a cobrança recorrente dele (para de gerar cobrança nova todo mês) e ele some do Kanban. Pra ver clientes inativos na lista, marque "Mostrar inativos". Dá pra reativar a qualquer momento.</p>
        </div>

        <div className="man-sec" id="man-cobrancas">
          <h2>Cobranças</h2>
          <p className="man-sub">Onde ficam os valores e vencimentos de cada cliente.</p>
          <h3>Cobrança recorrente (mensalidade automática)</h3>
          <p>Abra o cliente → aba <b>Cobrança</b> → seção "Cobrança recorrente": marque Ativa, informe valor, dia de vencimento e periodicidade (geralmente Mensal). Salve. A partir daí, o sistema gera a cobrança daquele mês sozinho, sempre que alguém abre o app — não precisa lançar mês a mês na mão.</p>
          <h3>Cobrança avulsa (pontual)</h3>
          <p>Na mesma aba Cobrança, seção "Lançar cobrança avulsa": informe valor e vencimento, clique em Lançar. Use pra cobranças que não se repetem todo mês.</p>
          <h3>Marcar como paga</h3>
          <p>Tanto na ficha do cliente quanto na lista geral de Cobranças, clique em <b>Marcar como paga</b>. Se marcar errado, dá pra <b>Estornar</b> na ficha do cliente.</p>
          <h3>Observações por cobrança</h3>
          <p>Na lista de Cobranças (e também na ficha do cliente), cada cobrança tem uma coluna de observação — clique no ✏️, escreva e Salvar. Serve pra anotar coisas tipo "cliente disse que paga dia 5" sem precisar abrir a ficha inteira.</p>
          <h3>Filtrar por data</h3>
          <p>Na lista de Cobranças, use os campos "Vencimento de" / "até" pra ver só as cobranças de um período — combina com o filtro de status também.</p>
          <h3>Importar cobranças em massa (CSV)</h3>
          <p>Diferente da importação de Clientes, esta cria <b>cobranças reais</b>, com valor e data verdadeiros — direto na tela de Cobranças, botão <b>Importar cobranças (CSV)</b>.</p>
          <ol>
            <li>Cole os dados — colunas esperadas: código, valor, vencimento (formato DD/MM/AAAA), e opcionalmente nome, carteira e tipo</li>
            <li>Detectar colunas → confira o mapeamento</li>
            <li>Confirmar importação</li>
          </ol>
          <ul>
            <li>Se o código ainda não for um cliente cadastrado, o sistema <b>cadastra ele sozinho</b></li>
            <li>Várias linhas com o mesmo código são normais (parcelas, cobranças diferentes do mesmo cliente)</li>
            <li>Cliente com tipo "Cobrança Recorrente" na planilha já sai com a recorrência mensal configurada automaticamente</li>
            <li>Reimportar o mesmo arquivo <b>não duplica</b> — o sistema reconhece o que já foi importado</li>
          </ul>
        </div>

        <div className="man-sec" id="man-tarefas">
          <h2>Tarefas</h2>
          <p className="man-sub">Os lembretes de ação — o que fazer, com quem, até quando.</p>
          <p>Toda vez que um cliente muda de etapa no funil (D-7, D+7, etc.), o sistema cria uma tarefa automática pro responsável daquela etapa — por exemplo, "Realizar comunicação de acompanhamento da inadimplência" quando entra em D+7.</p>
          <p>Dá pra criar tarefas na mão também, tanto pela tela geral de <b>Tarefas</b> quanto de dentro da ficha do cliente (aba Tarefas).</p>
          <p>Marque como concluída clicando na bolinha ao lado da tarefa. Tarefa vencida e ainda pendente aparece destacada em vermelho, com quantos dias de atraso.</p>
          <p>Na tela geral de Tarefas dá pra filtrar por status, responsável e "só atrasadas".</p>
        </div>

        <div className="man-sec" id="man-dashboard">
          <h2>Dashboard</h2>
          <p className="man-sub">Os números: quanto entra, quanto está atrasado, por carteira.</p>
          <ul>
            <li><b>Receita de mensalidades</b> — total previsto no mês</li>
            <li><b>Recebido</b> — o que já foi pago</li>
            <li><b>Em aberto</b> — ainda não venceu</li>
            <li><b>Vencido</b> — já passou do vencimento e não foi pago</li>
            <li><b>Inadimplente</b> — mesmo valor do vencido, olhando pro mês selecionado</li>
            <li><b>% Inadimplência</b> — inadimplente ÷ receita prevista</li>
            <li><b>Perdido</b> — soma do que está em aberto de clientes já em Rescisão/Notificação/Jurídico (dinheiro que dificilmente volta)</li>
          </ul>
          <p>Use os seletores no topo pra trocar o <b>mês/ano</b> e filtrar por <b>carteira</b> (ou deixar "Visão geral" pra ver todas juntas). Os cards mostram a variação comparado ao mês anterior.</p>
          <p>A tabela "Inadimplência por carteira" e os gráficos de baixo (mensal, acumulada, por carteira, receita, recebido×vencido) sempre olham pros últimos 6 meses.</p>
        </div>

        <div className="man-sec" id="man-config">
          <h2>Configurações</h2>
          <p className="man-sub">Só Administrador enxerga esta tela.</p>
          <h3>Responsáveis por etapa</h3>
          <p>Define quem é o responsável padrão de cada etapa do funil (D-7, D-1, etc.) — isso é o que aparece nos cartões e nas tarefas automáticas. Dá pra mudar a qualquer momento.</p>
          <h3>Carteiras</h3>
          <p>Lista de carteiras/equipes (ex.: Celeste, Êxitos, Delta), separadas por vírgula.</p>
          <h3>Usuários e permissões</h3>
          <p>Cadastre aqui todo mundo que vai usar o sistema — nome, e-mail e senha, e o perfil de acesso:</p>
          <ul>
            <li><b>Administrador</b> — acesso total, inclusive Configurações</li>
            <li><b>Financeiro</b> — acesso completo ao dia a dia (CRM, clientes, cobranças, tarefas, dashboard), menos Configurações</li>
            <li><b>Responsável operacional</b> — mesma coisa, pensado pra quem cuida só de uma parte da operação</li>
            <li><b>Visualização</b> — só consulta, não edita nada</li>
          </ul>
          <div className="man-tip">💡 Sempre crie usuários por aqui, nunca direto no Firebase — criar direto lá não gera o perfil de acesso, e a pessoa não consegue entrar.</div>
        </div>

        <div className="man-sec" id="man-dia-a-dia">
          <h2>Rotina do dia a dia</h2>
          <p className="man-sub">Sugestão de como usar o sistema numa rotina normal.</p>
          <div className="man-step"><b>1. Abra o Kanban.</b> Isso já sincroniza as etapas e gera as cobranças recorrentes do mês sozinho.</div>
          <div className="man-step"><b>2. Olhe as colunas dos seus responsáveis</b> (filtro "Responsável") e os cartões com borda vermelha (tarefa atrasada).</div>
          <div className="man-step"><b>3. Abra a tela de Tarefas, filtre "Só atrasadas"</b> pra ver tudo que está pendente de todo mundo, num lugar só.</div>
          <div className="man-step"><b>4. Ao fazer contato com um cliente, marque a tarefa como concluída</b> e, se quiser registrar algo, use a observação da cobrança ou a aba Observações da ficha do cliente.</div>
          <div className="man-step"><b>5. Quando um cliente paga</b>, abra a ficha dele → aba Cobrança → Marcar como paga. Ele sai do funil sozinho e aparece em Regularizados.</div>
          <div className="man-step"><b>6. De vez em quando, dê uma olhada no Dashboard</b> pra ver o panorama geral e passar pro gestor.</div>
        </div>

        <div className="man-sec" id="man-duvidas">
          <h2>Dúvidas frequentes</h2>
          <h3>Um cliente devia ter avançado de etapa e não avançou.</h3>
          <p>Clique em "🔄 Sincronizar etapas com a data de hoje" no topo do Kanban. A sincronização roda sozinha quando alguém abre o sistema, mas às vezes ajuda forçar.</p>
          <h3>Mexi na etapa de um cliente e agora ele não se mexe mais sozinho.</h3>
          <p>Ele está com a trava manual (🔒) ligada. Abra a ficha dele e clique em "Devolver ao automático".</p>
          <h3>Cadastrei um cliente errado, como apago?</h3>
          <p>Hoje o sistema não tem exclusão de cliente pela tela (pra evitar apagar histórico por engano). Se precisar, use "Encerrar cliente" pra tirar ele de circulação, ou peça ajuda técnica pra remover direto no banco.</p>
          <h3>Esqueci minha senha.</h3>
          <p>Na tela de login, clique em "Esqueci minha senha" e informe seu e-mail — chega um link de redefinição.</p>
          <h3>Posso ver o sistema no celular?</h3>
          <p>Dá pra abrir, mas ele foi pensado pro uso em computador — em telas pequenas alguns quadros ficam apertados.</p>
        </div>

      </div>
    </div>
  );
}

/* ===================================================================
   APP RAIZ
   =================================================================== */
const NOMES_VIEW = { kanban:'CRM de Inadimplência', clientes:'Clientes', cobrancas:'Cobranças', tarefas:'Tarefas', dashboard:'Dashboard Financeiro', config:'Configurações', manual:'Manual do Sistema' };

function App(){
  const [usuario, setUsuario] = useState(null);
  const [authCarregando, setAuthCarregando] = useState(firebaseOk); // no modo Firebase, espera o onAuthStateChanged antes de decidir
  const [view, setView] = useState('kanban');
  const [busca, setBusca] = useState('');
  const [clienteAberto, setClienteAberto] = useState(null);

  const usuarios = useCollection('usuarios');
  const clientes = useCollection('clientes');
  const cobrancas = useCollection('cobrancas');
  const tarefas = useCollection('tarefas');
  const historico = useCollection('historico');
  const [configDoc, setConfigDoc] = useState({});

  useEffect(() => {
    if (firebaseOk && db) {
      const unsub = db.collection('config').doc('geral').onSnapshot(d => setConfigDoc(d.data() || {}));
      return unsub;
    }
    const ler = () => setConfigDoc((localDB().configGeral) || {});
    ler();
    window.addEventListener('local-db-changed', ler);
    return () => window.removeEventListener('local-db-changed', ler);
  }, []);

  // Modo Firebase: a sessão é gerenciada pelo próprio Firebase Auth (item
  // "proteção" — login de verdade com senha), não mais por localStorage.
  // Quando o auth muda (login/logout/refresh da página), busca o perfil
  // (nome/perfil) em usuarios/{uid}. Se a conta existe no Auth mas não
  // tem um perfil correspondente, desloga — ela não deveria ter acesso.
  useEffect(() => {
    if (!firebaseOk) return;
    const unsub = auth.onAuthStateChanged(async (authUser) => {
      if (!authUser) { setUsuario(null); setAuthCarregando(false); return; }
      try {
        const doc = await db.collection('usuarios').doc(authUser.uid).get();
        if (doc.exists) {
          setUsuario({ id: authUser.uid, ...doc.data() });
        } else {
          await auth.signOut();
          setUsuario(null);
        }
      } finally {
        setAuthCarregando(false);
      }
    });
    return unsub;
  }, []);

  // Modo local (sem Firebase): mantém sessão simples em localStorage.
  useEffect(() => {
    if (firebaseOk) return;
    const salvo = localStorage.getItem('crm_financeiro_usuario');
    if (salvo) {
      try { setUsuario(JSON.parse(salvo)); } catch(e){}
    }
  }, []);
  useEffect(() => {
    if (firebaseOk) return;
    if (usuario) localStorage.setItem('crm_financeiro_usuario', JSON.stringify(usuario));
  }, [usuario]);

  // Cobranças recorrentes: gera a cobrança do mês corrente sozinho, assim
  // que alguém com permissão de edição abre o sistema — sem isso, "mês que
  // vem" só aparecia se alguém lembrasse de clicar no botão do Dashboard.
  // Roda de novo sempre que a quantidade de clientes ou de cobranças muda
  // (não a cada detalhe, tipo marcar um pagamento) — é idempotente (só
  // cria o que ainda falta), então rodar mais de uma vez não duplica nada.
  useEffect(() => {
    if (!usuario || !podeEditar(usuario)) return;
    if (clientes.length === 0) return; // espera os dados carregarem
    gerarCobrancasRecorrentes(clientes, cobrancas, usuario.nome);
  }, [usuario, clientes, cobrancas]);

  function entrarDireto(u){ setUsuario(u); }
  async function sair(){
    if (firebaseOk) await auth.signOut();
    else { localStorage.removeItem('crm_financeiro_usuario'); setUsuario(null); }
  }

  if (authCarregando && !usuario) return <div className="lpage"><div style={{color:'var(--t2)',fontSize:13}}>Carregando...</div></div>;
  if (!usuario) return <Login usuarios={usuarios} onEntrar={entrarDireto} />;

  const clienteAtual = clienteAberto ? clientes.find(c => c.id === clienteAberto) : null;

  return (
    <div className="app">
      <Sidebar view={view} setView={setView} usuario={usuario} onSair={sair} />
      <div className="main">
        <Topbar titulo={NOMES_VIEW[view]} busca={busca} setBusca={setBusca} usuario={usuario} />
        {view==='kanban' && <KanbanView clientes={clientes} cobrancas={cobrancas} tarefas={tarefas} config={configDoc} usuario={usuario} busca={busca} onAbrirCliente={c=>setClienteAberto(c.id)} />}
        {view==='clientes' && <ClientesView clientes={clientes} cobrancas={cobrancas} tarefas={tarefas} historico={historico} config={configDoc} usuario={usuario} busca={busca} onAbrirCliente={c=>setClienteAberto(c.id)} />}
        {view==='cobrancas' && <CobrancasView clientes={clientes} cobrancas={cobrancas} usuario={usuario} busca={busca} />}
        {view==='tarefas' && <TarefasView clientes={clientes} tarefas={tarefas} usuario={usuario} busca={busca} />}
        {view==='dashboard' && <DashboardView clientes={clientes} cobrancas={cobrancas} config={configDoc} usuario={usuario} />}
        {view==='config' && ehAdmin(usuario) && <ConfiguracoesView config={configDoc} usuarios={usuarios} />}
        {view==='manual' && <ManualView />}
      </div>
      {clienteAtual && (
        <ClienteDetalheModal cliente={clienteAtual} cobrancas={cobrancas} tarefas={tarefas} historico={historico} config={configDoc} usuario={usuario} onClose={()=>setClienteAberto(null)} />
      )}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
