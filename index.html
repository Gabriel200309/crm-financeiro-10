// PREENCHA com as credenciais do SEU projeto Firebase (Firestore).

// Sem isso preenchido, o app roda em modo "offline" (só demonstração, nada é salvo).
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCOPDSkMVwxir2z6tHUFSaqgoZlYGo4fLk",
  authDomain: "df-crm-14fac.firebaseapp.com",
  projectId: "df-crm-14fac",
  storageBucket: "df-crm-14fac.firebasestorage.app",
  messagingSenderId: "226593640098",
  appId: "1:226593640098:web:65e0270982948622ce11fb",
  measurementId: "G-CF890RXQ7D"
};
let firebaseOk = true;
// Enquanto firebaseConfig ainda tiver os valores de exemplo, nem tenta
// conectar — cai direto no modo local (localStorage), pra dar pra
// testar o sistema inteiro antes de configurar o Firebase de verdade.
const configPreenchido = Object.values(firebaseConfig).every(v => v && !String(v).includes('COLE_AQUI'));
let db = null, auth = null, authSecundario = null;
if (!configPreenchido) {
  firebaseOk = false;
} else {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    authSecundario = firebase.initializeApp(firebaseConfig, "secundario").auth();

    console.error('Falha ao inicializar o Firebase:', e);

}

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ===================================================================
   CONSTANTES DO FUNIL (seções 4, 9, 10 do pedido) — nada fica fixo no
   código sem poder ser mudado depois: os responsáveis por etapa e as
   carteiras vêm de Configurações (Firestore), só a ORDEM/OFFSET do
   funil e as descrições das tarefas automáticas ficam aqui porque
   definem a regra de negócio em si.
   =================================================================== */
const ETAPAS = [
  { key:'D_MENOS_7', label:'D-7', curto:'D-7', offset:-7, desc:'Comunicação preventiva.' },
  { key:'D_MENOS_1', label:'D-1', curto:'D-1', offset:-1, desc:'Cobrança preventiva.' },
  { key:'D0', label:'D0 (vencimento)', curto:'D0', offset:0, desc:'Dia do vencimento.' },
  { key:'D_MAIS_1', label:'D+1', curto:'D+1', offset:1, desc:'Primeira cobrança após vencimento.' },
  { key:'D_MAIS_2', label:'D+2', curto:'D+2', offset:2, desc:'Acompanhamento do líder após a cobrança inicial do financeiro.' },
  { key:'D_MAIS_5', label:'D+5', curto:'D+5', offset:5, desc:'Segundo acompanhamento do líder antes da escalada para a Duda.' },
  { key:'D_MAIS_7', label:'D+7', curto:'D+7', offset:7, desc:'Acompanhamento da inadimplência.' },
  { key:'D_MAIS_10', label:'D+10 — Suspensão do suporte', curto:'D+10', offset:10, desc:'Comunicação de suspensão do suporte.' },
  { key:'D_MAIS_15', label:'D+15 — Suspensão das demandas', curto:'D+15', offset:15, desc:'Comunicação de suspensão das demandas.' },
  { key:'D_MAIS_20', label:'D+20 — Início da rescisão', curto:'D+20', offset:20, desc:'Início do processo de rescisão.' },
  { key:'RESCISAO', label:'Rescisão', curto:'Rescisão', offset:null, desc:'Cliente em processo de rescisão.' },
  { key:'NOTIFICACAO', label:'Notificação extrajudicial', curto:'Notificação', offset:null, desc:'Notificação extrajudicial.' },
  { key:'JURIDICO', label:'Jurídico', curto:'Jurídico', offset:null, desc:'Cliente encaminhado ao jurídico.' },
  { key:'REGULARIZADO', label:'Regularizado', curto:'Regularizado', offset:null, desc:null },
];
const ETAPA_LABEL = Object.fromEntries(ETAPAS.map(e=>[e.key,e.label]));
const ETAPA_CURTO = Object.fromEntries(ETAPAS.map(e=>[e.key,e.curto]));
const ETAPA_OFFSET = Object.fromEntries(ETAPAS.filter(e=>e.offset!==null).map(e=>[e.key,e.offset]));
const TAREFA_DESC = Object.fromEntries(ETAPAS.filter(e=>e.desc).map(e=>[e.key,e.desc]));
const ORDEM_FUNIL = ETAPAS.filter(e=>e.key!=='REGULARIZADO').map(e=>e.key);
const RESPONSAVEIS_PADRAO = { D_MENOS_7:'Líder', D_MENOS_1:'Financeiro', D0:'Financeiro', D_MAIS_1:'Financeiro', D_MAIS_2:'Líder', D_MAIS_5:'Líder', D_MAIS_7:'Duda', D_MAIS_10:'Duda', D_MAIS_15:'Duda', D_MAIS_20:'Duda', RESCISAO:'Duda', NOTIFICACAO:'Duda', JURIDICO:'Duda' };
const CARTEIRAS_PADRAO = ['Celeste','Êxitos','Delta'];
const PERFIS = { ADMINISTRADOR:'Administrador', FINANCEIRO:'Financeiro', OPERACIONAL:'Responsável operacional', VISUALIZACAO:'Visualização (somente leitura)' };
const PERIODICIDADES = { MENSAL:{label:'Mensal',meses:1}, BIMESTRAL:{label:'Bimestral',meses:2}, TRIMESTRAL:{label:'Trimestral',meses:3}, SEMESTRAL:{label:'Semestral',meses:6}, ANUAL:{label:'Anual',meses:12} };

/* ===================================================================
   UTILITÁRIOS DE DATA/DINHEIRO (item 10: tudo calculado dinamicamente,
   nunca data fixa) e persistência local (fallback sem Firebase).
   =================================================================== */
function hojeSemHora(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function toDate(v){ if(!v) return null; if(v.toDate) return v.toDate(); const d=new Date(v); d.setHours(0,0,0,0); return d; }
function addDays(date, n){ const d=new Date(date); d.setDate(d.getDate()+n); return d; }
// addMonths robusto contra "virada de mês": sem isso, 31/out - 1 mês
// vira 01/nov em vez de 30/set, porque o JS estoura o dia quando o mês
// de destino tem menos dias (setembro só tem 30).
function addMonths(date, n){
  const d = new Date(date);
  const dia = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const ultimoDiaDoMesDestino = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(dia, ultimoDiaDoMesDestino));
  return d;
}
function diffDays(de, ate){ return Math.round((toDate(ate) - toDate(de)) / 86400000); }
function fmtDate(v){ const d=toDate(v); return d ? d.toLocaleDateString('pt-BR') : '—'; }
function toInputDate(v){ const d=toDate(v); if(!d) return ''; const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function fmtMoney(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function parseMoney(v){ if(typeof v==='number') return v; const s=String(v||'0').replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3},)/g,'').replace(',', '.'); return parseFloat(s)||0; }
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function competenciaDe(data){ const d=toDate(data)||hojeSemHora(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

// Parser de CSV robusto pra importação em massa (item 9/18 do pedido):
// detecta automaticamente vírgula ou ponto-e-vírgula como separador
// (exportações brasileiras — Excel, Asaas — geralmente usam ; porque a
// vírgula já é o separador decimal) e entende campos entre aspas.
function parseCsv(texto){
  const linhas = texto.replace(/\r\n?/g, '\n').split('\n').filter(l => l.trim().length > 0);
  if (linhas.length === 0) return { headers: [], linhasDados: [] };
  const amostra = linhas[0];
  const delimitador = (amostra.match(/;/g) || []).length > (amostra.match(/,/g) || []).length ? ';' : ',';
  function parseLinha(linha){
    const campos = [];
    let atual = '';
    let dentroAspas = false;
    for (let i = 0; i < linha.length; i++) {
      const ch = linha[i];
      if (ch === '"') {
        if (dentroAspas && linha[i+1] === '"') { atual += '"'; i++; }
        else dentroAspas = !dentroAspas;
      } else if (ch === delimitador && !dentroAspas) {
        campos.push(atual.trim()); atual = '';
      } else {
        atual += ch;
      }
    }
    campos.push(atual.trim());
    return campos;
  }
  const headers = parseLinha(linhas[0]);
  const linhasDados = linhas.slice(1).map(parseLinha);
  return { headers, linhasDados, delimitador };
}
// Tenta adivinhar qual coluna do CSV corresponde a cada campo do
// sistema, pelo nome do cabeçalho — só um ponto de partida, o usuário
// confirma/ajusta no mapeamento antes de importar.
function adivinharMapeamento(headers){
  const normaliza = h => h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const candidatos = {
    codigo: ['codigo','código','id','codigo_cliente','id_cliente'],
    nome: ['nome','cliente','razao social','razaosocial','nome_cliente'],
    carteira: ['carteira','equipe','time','grupo'],
    valor: ['valor','mensalidade','preco','preço','valor_mensalidade'],
    vencimento: ['vencimento','dia_vencimento','diavencimento','dia'],
  };
  const mapeamento = { codigo:'', nome:'', carteira:'', valor:'', vencimento:'' };
  const headersNorm = headers.map(normaliza);
  for (const campo of Object.keys(candidatos)) {
    const idx = headersNorm.findIndex(h => candidatos[campo].includes(h));
    if (idx >= 0) mapeamento[campo] = headers[idx];
  }
  return mapeamento;
}

/* ===================================================================
   CAMADA DE DADOS — Firestore (item 23/24 do pedido: coleções
   separadas por entidade, nunca tudo num documento só, e sincronização
   em tempo real via onSnapshot). Se o Firebase não estiver configurado,
   cai num modo local (localStorage) só para dar pra ver a interface —
   deixo isso bem sinalizado na tela de login.
   =================================================================== */
const LOCAL_KEY = 'crm_financeiro_local_v1';
function localDB(){
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch(e){ return {}; }
}
function saveLocalDB(db){ localStorage.setItem(LOCAL_KEY, JSON.stringify(db)); }

// Hook genérico de coleção: tempo real quando há Firebase, senão lê do
// localStorage (sem realtime, mas funcional para teste).
function useCollection(nome){
  const [dados, setDados] = useState([]);
  useEffect(() => {
    if (firebaseOk && db) {
      const unsub = db.collection(nome).onSnapshot(snap => {
        setDados(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      }, err => console.error('onSnapshot', nome, err));
      return unsub;
    }
    const ler = () => setDados((localDB()[nome]) || []);
    ler();
    window.addEventListener('local-db-changed', ler);
    return () => window.removeEventListener('local-db-changed', ler);
  }, [nome]);
  return dados;
}

async function criarDoc(nome, dado){
  if (firebaseOk && db) {
    const ref = await db.collection(nome).add(dado);
    return ref.id;
  }
  const all = localDB();
  const id = uid();
  all[nome] = all[nome] || [];
  all[nome].push({ id, ...dado });
  saveLocalDB(all);
  window.dispatchEvent(new Event('local-db-changed'));
  return id;
}
async function atualizarDoc(nome, id, patch){
  if (firebaseOk && db) {
    await db.collection(nome).doc(id).set(patch, { merge: true });
    return;
  }
  const all = localDB();
  all[nome] = (all[nome] || []).map(d => d.id === id ? { ...d, ...patch } : d);
  saveLocalDB(all);
  window.dispatchEvent(new Event('local-db-changed'));
}
// Config geral (responsaveis/carteiras) é um doc único, não uma
// coleção — helper dedicado pra funcionar igual nos dois modos.
async function salvarConfig(patch){
  if (firebaseOk && db) {
    await db.collection('config').doc('geral').set(patch, { merge: true });
    return;
  }
  const all = localDB();
  all.configGeral = { ...(all.configGeral||{}), ...patch };
  saveLocalDB(all);
  window.dispatchEvent(new Event('local-db-changed'));
}
async function excluirDoc(nome, id){
  if (firebaseOk && db) { await db.collection(nome).doc(id).delete(); return; }
  const all = localDB();
  all[nome] = (all[nome] || []).filter(d => d.id !== id);
  saveLocalDB(all);
  window.dispatchEvent(new Event('local-db-changed'));
}


/* ===================================================================
   REGRAS DO FUNIL (itens 4-11 e 21 do pedido).
   =================================================================== */
// Cobrança de referência: a mais antiga ainda não paga. Clientes cuja
// única pendência é honorário de êxito nunca entram no funil de
// inadimplência de mensalidade (item 21).
function cobrancaReferencia(cliente, cobrancas){
  const doCliente = cobrancas.filter(c => c.clienteId === cliente.id && !c.dataPagamento);
  if (doCliente.length === 0) return null;
  return doCliente.reduce((antiga, atual) => toDate(atual.vencimento) < toDate(antiga.vencimento) ? atual : antiga);
}
function statusCobranca(cobranca, hoje){
  if (!cobranca) return null;
  if (cobranca.dataPagamento) return { status:'PAGA', diasAtraso:0 };
  const dias = diffDays(cobranca.vencimento, hoje);
  return { status: dias > 0 ? 'ATRASADA' : 'PENDENTE', diasAtraso: Math.max(0, dias) };
}
// Tag automática de atraso (item 6/9): "Em atraso" até 29 dias, depois "Inadimplente".
function tagAutomatica(diasAtraso){
  if (!diasAtraso || diasAtraso <= 0) return null;
  return diasAtraso < 30 ? 'Em atraso' : 'Inadimplente';
}

/* -------------------------------------------------------------------
   PROGRESSÃO AUTOMÁTICA DO FUNIL (item 4 da ata da reunião — prioridade
   1: "o sistema deverá controlar automaticamente a evolução do
   cliente conforme os dias de atraso"). A etapa é CALCULADA a partir
   da data de vencimento a cada carregamento — não depende de alguém
   arrastar o card. D-7→D-1→D0→D+1→D+2→D+5→D+7→D+10→D+15→D+20→Rescisão
   acontece sozinho. Só passa a ser manual (Notificação/Jurídico/
   Regularizado) quando alguém explicitamente assume o card — aí o
   campo `travaManual` passa a valer e a automação para de mexer nele.
   ------------------------------------------------------------------- */
function etapaAutomaticaPorData(vencimento, hoje){
  const dias = diffDays(vencimento, hoje); // positivo = dias já vencidos
  if (dias < -7) return null;        // mais de 7 dias pro vencimento: fora do funil (em dia)
  if (dias < -1) return 'D_MENOS_7';
  if (dias < 0) return 'D_MENOS_1';
  if (dias === 0) return 'D0';
  if (dias < 2) return 'D_MAIS_1';
  if (dias < 5) return 'D_MAIS_2';
  if (dias < 7) return 'D_MAIS_5';
  if (dias < 10) return 'D_MAIS_7';
  if (dias < 15) return 'D_MAIS_10';
  if (dias < 20) return 'D_MAIS_15';
  if (dias === 20) return 'D_MAIS_20';
  return 'RESCISAO'; // regra da reunião: ao completar D+20, rescisão é automática
}
// Próxima etapa/prazo a partir da etapa atual — cálculo sempre
// dinâmico a partir do vencimento da cobrança de referência.
function proximaAcao(etapaAtual, vencimentoRef, hoje){
  const idx = etapaAtual ? ORDEM_FUNIL.indexOf(etapaAtual) : -1;
  const proxima = ORDEM_FUNIL[idx+1];
  if (!proxima || !(proxima in ETAPA_OFFSET)) return { proxima:null, data:null, atrasada:false, dias:0 };
  const data = addDays(vencimentoRef, ETAPA_OFFSET[proxima]);
  const dias = diffDays(data, hoje);
  return { proxima, data, atrasada: dias > 0, dias: Math.max(0, dias) };
}
// Monta a visão consolidada de cada cliente pro Kanban/lista/dashboard.
function montarVisaoCliente(cliente, cobrancas, tarefas, responsaveis, hoje){
  const referencia = cobrancaReferencia(cliente, cobrancas);
  const etapaAuto = referencia ? etapaAutomaticaPorData(referencia.vencimento, hoje) : null;
  const etapaEfetiva = referencia
    ? (cliente.travaManual ? (cliente.etapaAtual || etapaAuto) : etapaAuto)
    : (cliente.etapaAtual ? 'REGULARIZADO' : null);
  const statusRef = statusCobranca(referencia, hoje);
  const prox = referencia ? proximaAcao(etapaEfetiva, referencia.vencimento, hoje) : { proxima:null, data:null, atrasada:false, dias:0 };
  const tarefasCliente = tarefas.filter(t => t.clienteId === cliente.id);
  const tarefasAtrasadas = tarefasCliente.filter(t => t.status === 'PENDENTE' && diffDays(t.prazo, hoje) > 0);
  return {
    ...cliente,
    referencia,
    etapaEfetiva,
    diasAtraso: statusRef ? statusRef.diasAtraso : 0,
    tagAuto: statusRef ? tagAutomatica(statusRef.diasAtraso) : null,
    responsavelEtapa: etapaEfetiva ? (responsaveis[etapaEfetiva] || 'A definir') : null,
    proximaEtapa: prox.proxima,
    proximaData: prox.data,
    proximaAtrasada: prox.atrasada,
    proximaDias: prox.dias,
    tarefas: tarefasCliente,
    tarefasAtrasadas,
  };
}

// Move o cliente de etapa (usado pelo drag-and-drop e pela seleção manual
// no modal). Isso LIGA a trava manual — a partir daqui a automação para
// de mexer nesse cliente, até alguém clicar em "Devolver ao automático".
// Grava histórico (nunca apagado, item 3) e cria a tarefa automática da
// nova etapa (item 8), com prazo calculado a partir da cobrança de
// referência e responsável de Configurações.
async function moverEtapaCliente(cliente, cobrancas, novaEtapaBruta, responsaveis, usuario){
  const novaEtapa = (!novaEtapaBruta || novaEtapaBruta === 'REGULARIZADO') ? null : novaEtapaBruta;
  await atualizarDoc('clientes', cliente.id, { etapaAtual: novaEtapa, travaManual: true });
  await criarDoc('historico', {
    clienteId: cliente.id, data: new Date().toISOString(), usuario,
    texto: `Movido manualmente para ${novaEtapa ? ETAPA_LABEL[novaEtapa] : 'Em dia / Regularizado'}.`, etapa: novaEtapa,
  });
  if (novaEtapa && novaEtapa !== 'REGULARIZADO' && TAREFA_DESC[novaEtapa]) {
    const referencia = cobrancaReferencia(cliente, cobrancas);
    const offset = ETA_OFF_OR_ZERO(novaEtapa);
    const prazo = referencia ? addDays(referencia.vencimento, offset) : new Date();
    await criarDoc('tarefas', {
      clienteId: cliente.id, descricao: TAREFA_DESC[novaEtapa], responsavel: responsaveis[novaEtapa] || 'A definir',
      prazo: prazo.toISOString(), prioridade: 'MEDIA', status: 'PENDENTE', etapaOrigem: novaEtapa,
      automatica: true, criadoPor: usuario, criadoEm: new Date().toISOString(),
    });
  }
}
// Devolve o cliente pro piloto automático (destrava).
async function destravarAutomatico(cliente, usuario){
  await atualizarDoc('clientes', cliente.id, { travaManual: false });
  await criarDoc('historico', { clienteId: cliente.id, data: new Date().toISOString(), usuario, texto: 'Devolvido ao fluxo automático (D-7 a D+20, com D+2 e D+5, calculado por data).', etapa: null });
}
function ETA_OFF_OR_ZERO(etapa){ return etapa in ETAPA_OFFSET ? ETAPA_OFFSET[etapa] : 0; }

// Roda a cada carregamento (e sob demanda): para clientes SEM trava
// manual, sincroniza etapaAtual com a etapa calculada pela data e — só
// quando a etapa realmente muda — grava histórico + tarefa automática
// da nova etapa (mesma regra do moverEtapaCliente, sem travar).
// Roda a cada carregamento (e sob demanda): para clientes SEM trava
// manual, sincroniza etapaAtual com a etapa calculada pela data e — só
// quando a etapa realmente muda — grava histórico + tarefa automática
// da nova etapa (mesma regra do moverEtapaCliente, sem travar).
//
// BUG CORRIGIDO: quando o cliente pagava e ficava sem nenhuma cobrança
// aberta, essa função zerava etapaAtual (etapaCalculada=null) — e como
// "Regularizado" só aparece quando etapaAtual continua preenchido (é
// esse valor que sinaliza "já esteve no funil"), o cliente sumia da
// tela inteira em vez de aparecer em Regularizados. Agora, sem cobrança
// aberta, a função nem mexe no cliente — ele fica marcado como estava,
// e a tela já mostra "Regularizado" sozinha (referência paga + etapa
// antiga preenchida) sem precisar apagar nada.
async function sincronizarEtapasAutomaticas(clientes, cobrancas, tarefas, responsaveis, hoje){
  let avancos = 0;
  for (const cliente of clientes) {
    if (cliente.tipoCobranca === 'EXITO' || cliente.ativo === false || cliente.travaManual) continue;
    const referencia = cobrancaReferencia(cliente, cobrancas);
    if (!referencia) continue; // pagou tudo — nada a avançar; a tela já mostra Regularizado sozinha
    const etapaCalculada = etapaAutomaticaPorData(referencia.vencimento, hoje);
    if (etapaCalculada === (cliente.etapaAtual || null)) continue;
    const diasRef = diffDays(referencia.vencimento, hoje);
    const rotuloDias = diasRef>=0 ? ` (D+${diasRef})` : ` (D${diasRef})`;
    await atualizarDoc('clientes', cliente.id, { etapaAtual: etapaCalculada });
    await criarDoc('historico', {
      clienteId: cliente.id, data: hoje.toISOString(), usuario: 'sistema (automático)',
      texto: `Avançou automaticamente para ${etapaCalculada ? ETAPA_LABEL[etapaCalculada] : 'Em dia'}${rotuloDias}.`,
      etapa: etapaCalculada,
    });
    if (etapaCalculada && TAREFA_DESC[etapaCalculada]) {
      const jaTem = tarefas.some(t => t.clienteId === cliente.id && t.etapaOrigem === etapaCalculada && t.automatica);
      if (!jaTem) {
        const prazo = addDays(referencia.vencimento, ETA_OFF_OR_ZERO(etapaCalculada));
        await criarDoc('tarefas', {
          clienteId: cliente.id, descricao: TAREFA_DESC[etapaCalculada], responsavel: responsaveis[etapaCalculada] || 'A definir',
          prazo: prazo.toISOString(), prioridade: 'MEDIA', status: 'PENDENTE', etapaOrigem: etapaCalculada,
          automatica: true, criadoPor: 'sistema (automático)', criadoEm: hoje.toISOString(),
        });
      }
    }
    avancos++;
  }
  return avancos;
}

/* ===================================================================
   COBRANÇA RECORRENTE (item 20) — gera as cobranças em aberto a partir
   da configuração do cliente, respeitando periodicidade, data
   inicial/final e quantidade de parcelas. Sem servidor/cron, isso roda
   quando o usuário abre o Dashboard ou clica em "Gerar cobranças
   pendentes" — por isso é importante abrir o app periodicamente, ou
   plugar isso num Cloud Function se quiser 100% automático depois.
   =================================================================== */
async function gerarCobrancasRecorrentes(clientes, cobrancasExistentes, usuario){
  const hoje = hojeSemHora();
  let geradas = 0;
  for (const c of clientes) {
    // item 7 da ata: "quando o cliente sair da base, a cobrança
    // recorrente deverá ser encerrada" — cliente inativo nunca gera cobrança nova.
    if (c.ativo === false) continue;
    const r = c.cobrancaRecorrente;
    if (!r || !r.ativo || !r.valor || !r.diaVencimento) continue;
    if (r.dataInicial && toDate(r.dataInicial) > hoje) continue;
    if (r.dataFinal && toDate(r.dataFinal) < hoje) continue;

    const jaGeradas = cobrancasExistentes.filter(cb => cb.clienteId === c.id && cb.geradaAutomaticamente);
    if (r.quantidadeParcelas && jaGeradas.length >= Number(r.quantidadeParcelas)) continue;

    const intervaloMeses = (PERIODICIDADES[r.periodicidade] || PERIODICIDADES.MENSAL).meses;
    const referenciaData = r.dataInicial ? toDate(r.dataInicial) : toDate(c.createdAt) || hoje;
    // Gera a competência atual se estiver no ciclo certo e ainda não existir.
    const mesesDesde = (hoje.getFullYear() - referenciaData.getFullYear()) * 12 + (hoje.getMonth() - referenciaData.getMonth());
    if (mesesDesde < 0 || mesesDesde % intervaloMeses !== 0) continue;

    const competencia = competenciaDe(hoje);
    const existeNaCompetencia = cobrancasExistentes.some(cb => cb.clienteId === c.id && cb.competencia === competencia);
    if (existeNaCompetencia) continue;

    const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
    const dia = Math.min(Number(r.diaVencimento), ultimoDia);
    const vencimento = new Date(hoje.getFullYear(), hoje.getMonth(), dia);

    await criarDoc('cobrancas', {
      clienteId: c.id, valor: Number(r.valor), competencia, vencimento: vencimento.toISOString(),
      dataPagamento: null, geradaAutomaticamente: true, formaPagamento: r.formaPagamento || null,
      criadoEm: new Date().toISOString(), criadoPor: usuario || 'automacao',
    });
    geradas++;
  }
  return geradas;
}

function Toast({ mensagem }){
  if (!mensagem) return null;
  return <div className="toast">{mensagem}</div>;
}

function Modal({ titulo, onClose, children, footer, wide }){
  return (
    <div className="overlay" onMouseDown={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={wide?{maxWidth:920}:undefined}>
        <div className="mhdr">
          <div className="mtitle">{titulo}</div>
          <button className="mclose" onClick={onClose}>×</button>
        </div>
        {children}
        {footer && <div className="mfooter">{footer}</div>}
      </div>
    </div>
  );
}

function Avatar({ nome, cor }){
  const inicial = (nome||'?').trim().charAt(0).toUpperCase();
  return <div className="av" style={{width:30,height:30,fontSize:13,background: cor || '#607d8b'}}>{inicial}</div>;
}

const CORES_AVATAR = ['#1a9e4a','#3182ce','#805ad5','#ed8936','#e53e3e','#0d9488','#c026d3'];
function corPara(texto){
  let h = 0;
  for (let i=0;i<(texto||'').length;i++) h = (h*31 + texto.charCodeAt(i)) % CORES_AVATAR.length;
  return CORES_AVATAR[Math.abs(h)];
}

    if (etapaParaHistorico) {
      await criarDoc('tarefas', {
        clienteId, descricao: TAREFA_DESC[etapaParaHistorico] || 'Acompanhar cliente.', responsavel: RESPONSAVEIS_PADRAO[etapaParaHistorico] || 'Duda',
        prazo: vencimento.toISOString(), prioridade:'MEDIA', status:'PENDENTE', etapaOrigem: etapaParaHistorico,
        automatica:true, criadoPor:'exemplo', criadoEm:new Date().toISOString(),
      });
      await criarDoc('historico', { clienteId, data:new Date().toISOString(), usuario:'exemplo', texto:`Movido para ${ETAPA_LABEL[etapaParaHistorico]}.`, etapa:etapaParaHistorico });
    }
  }
}

/* ===================================================================
   LOGIN — sem senha (uso interno), escolhe o usuário cadastrado em
   Configurações > Usuários. O primeiro usuário do escritório vira
   Administrador automaticamente.
   =================================================================== */
function Login({ usuarios, onEntrar }){
  const [nome, setNome] = useState('');
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [criando, setCriando] = useState(usuarios.length === 0);
  const [carregandoExemplo, setCarregandoExemplo] = useState(false);
  const [enviando, setEnviando] = useState(false);
  const [erro, setErro] = useState('');
  const [avisoReset, setAvisoReset] = useState('');

  async function entrarComExemplo(){
    setCarregandoExemplo(true);
    await semearDadosExemplo();
    const id = await criarDoc('usuarios', { nome: 'Você (teste)', perfil: 'ADMINISTRADOR', criadoEm: new Date().toISOString() });
    onEntrar({ id, nome: 'Você (teste)', perfil: 'ADMINISTRADOR' });
  }

  // Modo local (sem Firebase): mantém o login simples de antes — sem
  // senha, só escolher/criar um perfil. Não tem dado sensível de verdade
  // guardado em lugar nenhum (é só localStorage do seu navegador).
  async function criarPrimeiroUsuarioLocal(e){
    e.preventDefault();
    if (!nome.trim()) return;
    const id = await criarDoc('usuarios', { nome: nome.trim(), perfil: 'ADMINISTRADOR', criadoEm: new Date().toISOString() });
    onEntrar({ id, nome: nome.trim(), perfil: 'ADMINISTRADOR' });
  }

  // Modo Firebase: autenticação de verdade (e-mail/senha). O primeiro
  // administrador é criado aqui; os demais usuários são criados em
  // Configurações por um administrador já logado.
  async function criarPrimeiroAdministrador(e){
    e.preventDefault();
    setErro(''); setEnviando(true);
    try {
      const cred = await auth.createUserWithEmailAndPassword(email.trim(), senha);
      const perfil = { nome: nome.trim(), email: email.trim(), perfil: 'ADMINISTRADOR', criadoEm: new Date().toISOString() };
      await db.collection('usuarios').doc(cred.user.uid).set(perfil);
      // Não dá pra confiar só no onAuthStateChanged aqui: ele pode disparar
      // antes dessa escrita do perfil terminar (é uma corrida real, não só
      // teórica), e o App tentaria ler um perfil que ainda não existe e
      // devolveria pro login. Por isso entra direto, com os dados que a
      // gente já tem em mãos.
      onEntrar({ id: cred.user.uid, ...perfil });
    } catch (err) {
      setErro(mensagemErroAuth(err));
    } finally {
      setEnviando(false);
    }
  }
  async function entrarComSenha(e){
    e.preventDefault();
    setErro(''); setEnviando(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), senha);
    } catch (err) {
      setErro(mensagemErroAuth(err));
    } finally {
      setEnviando(false);
    }
  }
  async function esqueciSenha(){
    if (!email.trim()) { setErro('Digite seu e-mail acima primeiro, depois clique em "Esqueci minha senha".'); return; }
    setErro(''); setAvisoReset('');
    try {
      await auth.sendPasswordResetEmail(email.trim());
      setAvisoReset('Enviamos um link de redefinição de senha pro seu e-mail.');
    } catch (err) {
      setErro(mensagemErroAuth(err));
    }
  }

  return (
    <div className="lpage">
      <div className="lcard">
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:22}}>
          <div className="s-logo" style={{marginBottom:0}}>CF</div>
          <div>
            <div style={{fontWeight:700,fontSize:16}}>CRM Financeiro</div>
            <div style={{fontSize:12,color:'var(--t2)'}}>Acompanhamento de inadimplência</div>
          </div>
        </div>
        {!firebaseOk && (
          <div className="badge b-o" style={{display:'block',marginBottom:16,padding:'8px 10px'}}>
            Firebase não configurado — rodando em modo local (só neste navegador, sem sincronização, sem senha). Edite <code>firebaseConfig</code> no topo do arquivo pra usar de verdade.
          </div>
        )}
        {!firebaseOk && usuarios.length === 0 && (
          <button className="btn btn-s" style={{width:'100%',justifyContent:'center',marginBottom:16}} onClick={entrarComExemplo} disabled={carregandoExemplo}>
            {carregandoExemplo ? 'Carregando...' : '⚡ Entrar com dados de exemplo (pra testar)'}
          </button>
        )}

        {!firebaseOk ? (
          criando ? (
            <form onSubmit={criarPrimeiroUsuarioLocal}>
              <p style={{fontSize:13,color:'var(--t2)',marginBottom:14}}>Nenhum usuário cadastrado ainda. Crie o primeiro (vira Administrador).</p>
              <div className="fg">
                <label className="fl">Seu nome</label>
                <input className="fi" autoFocus value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex.: Duda" />
              </div>
              <button className="btn btn-g" style={{width:'100%',justifyContent:'center'}} type="submit">Criar e entrar</button>
            </form>
          ) : (
            <>
              <p style={{fontSize:13,color:'var(--t2)',marginBottom:14}}>Quem é você?</p>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {usuarios.map(u => (
                  <button key={u.id} className="btn btn-s" style={{justifyContent:'flex-start'}} onClick={()=>onEntrar(u)}>
                    <Avatar nome={u.nome} cor={corPara(u.nome)} /> {u.nome}
                    <span style={{marginLeft:'auto',fontSize:11,color:'var(--tl)'}}>{PERFIS[u.perfil]}</span>
                  </button>
                ))}
              </div>
              <button className="btn btn-s btn-sm" style={{marginTop:14}} onClick={()=>setCriando(true)}>+ Novo usuário</button>
            </>
          )
        ) : usuarios.length === 0 ? (
          <form onSubmit={criarPrimeiroAdministrador}>
            <p style={{fontSize:13,color:'var(--t2)',marginBottom:14}}>Nenhum administrador cadastrado ainda. Crie o primeiro — os demais usuários você cadastra depois em Configurações.</p>
            <div className="fg"><label className="fl">Seu nome</label><input className="fi" autoFocus required value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex.: Duda" /></div>
            <div className="fg"><label className="fl">E-mail</label><input className="fi" type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder="voce@empresa.com" /></div>
            <div className="fg"><label className="fl">Senha (mínimo 6 caracteres)</label><input className="fi" type="password" required minLength={6} value={senha} onChange={e=>setSenha(e.target.value)} /></div>
            {erro && <p style={{fontSize:12,color:'var(--red)',marginBottom:10}}>{erro}</p>}
            <button className="btn btn-g" style={{width:'100%',justifyContent:'center'}} type="submit" disabled={enviando}>{enviando?'Criando...':'Criar administrador e entrar'}</button>
          </form>
        ) : (
          <form onSubmit={entrarComSenha}>
            <div className="fg"><label className="fl">E-mail</label><input className="fi" type="email" autoFocus required value={email} onChange={e=>setEmail(e.target.value)} /></div>
            <div className="fg"><label className="fl">Senha</label><input className="fi" type="password" required value={senha} onChange={e=>setSenha(e.target.value)} /></div>
            {erro && <p style={{fontSize:12,color:'var(--red)',marginBottom:10}}>{erro}</p>}
            {avisoReset && <p style={{fontSize:12,color:'var(--green)',marginBottom:10}}>{avisoReset}</p>}
            <button className="btn btn-g" style={{width:'100%',justifyContent:'center'}} type="submit" disabled={enviando}>{enviando?'Entrando...':'Entrar'}</button>
            <button type="button" className="btn btn-s btn-sm" style={{width:'100%',justifyContent:'center',marginTop:10}} onClick={esqueciSenha}>Esqueci minha senha</button>
          </form>
        )}
      </div>
    </div>
  );
}
function mensagemErroAuth(err){
  const codigo = err && err.code;
  const mapa = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/user-not-found': 'Não existe usuário com esse e-mail.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/email-already-in-use': 'Já existe uma conta com esse e-mail.',
    'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
    'auth/too-many-requests': 'Muitas tentativas seguidas — aguarde um pouco e tente de novo.',
  };
  return mapa[codigo] || (err && err.message) || 'Não foi possível entrar. Tente de novo.';
}

      {colunas.map(col => {
        const doColuna = visoes.filter(v => v.etapaEfetiva === col.key);
        const total = doColuna.reduce((s,v)=> s + (v.referencia ? Number(v.referencia.valor) : 0), 0);
        const responsavelColuna = responsaveis ? (responsaveis[col.key] || 'A definir') : null;
        return (
          <div key={col.key} className="kcol">

              <div>

              </div>

function KanbanView({ clientes, cobrancas, tarefas, config, usuario, busca, onAbrirCliente }){
  const [filtros, setFiltros] = useState({ carteira:'', responsavel:'', status:'', tarefas:'' });
  const [sincronizando, setSincronizando] = useState(false);
  const [msgSync, setMsgSync] = useState('');
  const jaSincronizouRef = useRef(false);
  const hoje = hojeSemHora();
  const responsaveis = config.responsaveis || RESPONSAVEIS_PADRAO;

  // Item 4 da reunião: o funil D-7→D+20→Rescisão avança sozinho por
  // data. Sincroniza assim que os clientes carregam do Firestore — e
  // só uma vez por sessão (o [] antigo aqui era um bug: rodava no
  // instante do mount, quando `clientes` ainda estava vazio porque o
  // onSnapshot do Firestore ainda não tinha respondido, então nunca
  // sincronizava nada de verdade).
  useEffect(() => {
    if (!podeEditar(usuario)) return;
    if (jaSincronizouRef.current) return;
    if (clientes.length === 0) return; // espera os dados chegarem
    jaSincronizouRef.current = true;
    sincronizarEtapasAutomaticas(clientes, cobrancas, tarefas, responsaveis, hoje).then(n => { if (n>0) setMsgSync(`${n} cliente(s) avançaram de etapa automaticamente.`); });
  }, [clientes]);
  async function sincronizarAgora(){
    setSincronizando(true);
    const n = await sincronizarEtapasAutomaticas(clientes, cobrancas, tarefas, responsaveis, hoje);
    setMsgSync(n>0 ? `${n} cliente(s) avançaram de etapa automaticamente.` : 'Tudo já estava em dia com a data de hoje.');
    setSincronizando(false);
    setTimeout(()=>setMsgSync(''), 4000);
  }

  const visoesTodas = useMemo(() => (
    clientes
      // item 21: honorário só de êxito nunca entra no funil de mensalidade;
      // clientes inativos (saíram da base) também somem do funil.
      .filter(c => c.tipoCobranca !== 'EXITO' && c.ativo !== false)
      .map(c => montarVisaoCliente(c, cobrancas, tarefas, responsaveis, hoje))
  ), [clientes, cobrancas, tarefas, responsaveis]);

  const visoes = useMemo(() => visoesTodas.filter(v => {
    if (busca) {
      const alvo = `${v.nome} ${v.codigo}`.toLowerCase();
      if (!alvo.includes(busca.toLowerCase())) return false;
    }
    if (filtros.carteira && v.carteira !== filtros.carteira) return false;
    if (filtros.responsavel && v.responsavelEtapa !== filtros.responsavel) return false;
    if (filtros.status === 'EM_DIA' && v.diasAtraso > 0) return false;
    if (filtros.status === 'ATRASO' && !(v.diasAtraso > 0 && v.diasAtraso < 30)) return false;
    if (filtros.status === 'INADIMPLENTE' && !(v.diasAtraso >= 30)) return false;
    if (filtros.tarefas === 'ATRASADAS' && v.tarefasAtrasadas.length === 0) return false;
    return true;
  }), [visoesTodas, busca, filtros]);

  const colunasFunil = ETAPAS.filter(e => e.key !== 'REGULARIZADO');
  const regularizados = visoes.filter(v => v.etapaEfetiva === 'REGULARIZADO');

  async function mover(clienteId, novaEtapa){
    if (!podeEditar(usuario)) return;
    const cliente = clientes.find(c => c.id === clienteId);
    if (!cliente) return;
    await moverEtapaCliente(cliente, cobrancas, novaEtapa, responsaveis, usuario.nome);
  }

  return (
    <>
      <FiltrosKanban filtros={filtros} setFiltros={setFiltros} carteiras={config.carteiras || CARTEIRAS_PADRAO} responsaveisNomes={[...new Set(Object.values(responsaveis))]} />
      <div style={{padding:'8px 16px 0', display:'flex', alignItems:'center', gap:10}}>
        {podeEditar(usuario) && <button className="btn btn-s btn-sm" onClick={sincronizarAgora} disabled={sincronizando}>{sincronizando?'Sincronizando...':'🔄 Sincronizar etapas com a data de hoje'}</button>}
        {msgSync && <span className="badge b-b">{msgSync}</span>}
      </div>
      <KanbanBoard visoes={visoes} colunas={colunasFunil} onMover={mover} onAbrir={onAbrirCliente} arrastavel={podeEditar(usuario)} responsaveis={responsaveis} />
      {regularizados.length > 0 && (
        <div style={{padding:'0 16px 16px'}}>
          <div className="ct" style={{marginBottom:8}}>Regularizados ({regularizados.length})</div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            {regularizados.map(v => (
              <div key={v.id} style={{width:250}}>
                <KanbanCard view={v} arrastavel={false} onAbrir={onAbrirCliente} />
              </div>
            ))}
          </div>
        </div>
      )}
    </>
  );
}

// Observação por cobrança — edição inline, usada tanto na lista geral
// de Cobranças quanto na ficha do cliente.
function ObservacaoCobranca({ cobranca, editar }){
  const [editando, setEditando] = useState(false);
  const [texto, setTexto] = useState(cobranca.observacoes || '');
  useEffect(()=>setTexto(cobranca.observacoes||''), [cobranca.id, cobranca.observacoes]);
  async function salvar(){
    await atualizarDoc('cobrancas', cobranca.id, { observacoes: texto });
    setEditando(false);
  }
  if (!editando) {
    return (
      <span style={{display:'inline-flex',alignItems:'center',gap:6}}>
        <span style={{color: cobranca.observacoes ? 'var(--t1)' : 'var(--tl)', fontSize:12, maxWidth:200, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}} title={cobranca.observacoes||''}>
          {cobranca.observacoes || (editar ? 'sem observação' : '—')}
        </span>
        {editar && <button className="btn btn-s btn-xs" onClick={()=>setEditando(true)} title="Editar observação">✏️</button>}
      </span>
    );
  }
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:4}}>
      <input className="fi" style={{fontSize:12,padding:'4px 6px',width:160}} value={texto} onChange={e=>setTexto(e.target.value)} autoFocus onKeyDown={e=>{ if(e.key==='Enter') salvar(); if(e.key==='Escape'){ setTexto(cobranca.observacoes||''); setEditando(false);} }} />
      <button className="btn btn-g btn-xs" onClick={salvar}>Salvar</button>
      <button className="btn btn-s btn-xs" onClick={()=>{ setTexto(cobranca.observacoes||''); setEditando(false); }}>×</button>
    </span>
  );
}

function AbaCobranca({ cliente, cobrancas, usuario, onAtualizarCliente }){
  const editar = podeEditar(usuario);
  const [novo, setNovo] = useState({ valor:'', competencia: competenciaDe(new Date()), vencimento: toInputDate(new Date()) });
  const [lancando, setLancando] = useState(false);
  const doCliente = cobrancas.filter(c => c.clienteId === cliente.id).sort((a,b)=> toDate(b.vencimento) - toDate(a.vencimento));
  const r = cliente.cobrancaRecorrente || {};
  const [rec, setRec] = useState(r);
  useEffect(()=>setRec(cliente.cobrancaRecorrente||{}), [cliente.id]);

  async function lancar(){
    if (!novo.valor || !novo.vencimento || lancando) return;
    // Bug corrigido: sem essa trava, clicar duas vezes rápido (ou clicar
    // de novo achando que não funcionou, já que não tinha nenhum aviso)
    // criava a cobrança duas vezes. O botão agora desabilita assim que
    // o clique é registrado e só libera de novo depois de terminar.
    setLancando(true);
    try {
      const vencimentoDate = new Date(novo.vencimento+'T00:00:00');
      await criarDoc('cobrancas', { clienteId: cliente.id, valor: parseMoney(novo.valor), competencia: competenciaDe(vencimentoDate), vencimento: vencimentoDate.toISOString(), dataPagamento: null, criadoEm: new Date().toISOString(), criadoPor: usuario.nome });
      setNovo({ valor:'', competencia: competenciaDe(new Date()), vencimento: toInputDate(new Date()) });
    } finally {
      setLancando(false);
    }
  }
  async function pagar(cobranca){
    await atualizarDoc('cobrancas', cobranca.id, { dataPagamento: new Date().toISOString() });
  }
  async function estornar(cobranca){
    await atualizarDoc('cobrancas', cobranca.id, { dataPagamento: null });
  }
  async function excluirCobranca(cobranca){
    if (!confirm(`Excluir a cobrança de ${fmtMoney(cobranca.valor)} (vence ${fmtDate(cobranca.vencimento)})? Essa ação não pode ser desfeita.`)) return;
    await excluirDoc('cobrancas', cobranca.id);
  }
  async function salvarRecorrencia(){
    await onAtualizarCliente({ ...cliente, cobrancaRecorrente: rec });
  }

  return (
    <div>
      <div className="fsec">Cobrança recorrente (item 20)</div>
      <div className="fr">
        <div className="fg"><label className="fl">Ativa?</label>
          <select className="fs" disabled={!editar} value={rec.ativo?'sim':'nao'} onChange={e=>setRec({...rec, ativo: e.target.value==='sim'})}>
            <option value="nao">Não</option><option value="sim">Sim</option>
          </select>
        </div>
        <div className="fg"><label className="fl">Valor (R$)</label><input className="fi" disabled={!editar} value={rec.valor||''} onChange={e=>setRec({...rec, valor:e.target.value})} placeholder="Ex.: 1.500,00" /></div>
        <div className="fg"><label className="fl">Dia de vencimento</label><input className="fi" type="number" min="1" max="31" disabled={!editar} value={rec.diaVencimento||''} onChange={e=>setRec({...rec, diaVencimento:e.target.value})} /></div>
        <div className="fg"><label className="fl">Periodicidade</label>
          <select className="fs" disabled={!editar} value={rec.periodicidade||'MENSAL'} onChange={e=>setRec({...rec, periodicidade:e.target.value})}>
            {Object.entries(PERIODICIDADES).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
          </select>
        </div>
        <div className="fg"><label className="fl">Data inicial</label><input className="fi" type="date" disabled={!editar} value={toInputDate(rec.dataInicial)} onChange={e=>setRec({...rec, dataInicial:e.target.value?new Date(e.target.value+'T00:00:00').toISOString():null})} /></div>
        <div className="fg"><label className="fl">Data final (opcional)</label><input className="fi" type="date" disabled={!editar} value={toInputDate(rec.dataFinal)} onChange={e=>setRec({...rec, dataFinal:e.target.value?new Date(e.target.value+'T00:00:00').toISOString():null})} /></div>
        <div className="fg"><label className="fl">Qtd. parcelas (vazio = indefinido)</label><input className="fi" type="number" min="1" disabled={!editar} value={rec.quantidadeParcelas||''} onChange={e=>setRec({...rec, quantidadeParcelas:e.target.value})} /></div>
        <div className="fg"><label className="fl">Forma de pagamento</label><input className="fi" disabled={!editar} value={rec.formaPagamento||''} onChange={e=>setRec({...rec, formaPagamento:e.target.value})} placeholder="Boleto, Pix..." /></div>
      </div>
      {editar && <button className="btn btn-s btn-sm" onClick={salvarRecorrencia}>Salvar recorrência</button>}

      <div className="fsec" style={{marginTop:16}}>Lançar cobrança avulsa</div>
      <div className="fr">
        <div className="fg"><label className="fl">Valor</label><input className="fi" disabled={!editar} value={novo.valor} onChange={e=>setNovo({...novo,valor:e.target.value})} placeholder="1.500,00" /></div>
        <div className="fg"><label className="fl">Vencimento</label><input className="fi" type="date" disabled={!editar} value={novo.vencimento} onChange={e=>setNovo({...novo,vencimento:e.target.value})} /></div>
      </div>

      <div className="fsec" style={{marginTop:16}}>Histórico financeiro</div>
      <div className="tlist">
        {doCliente.map(c => (
          <div key={c.id} className={`titem ${!c.dataPagamento && diffDays(c.vencimento, hojeSemHora())>0 ? 'ov2':''}`}>
            <span style={{fontWeight:600}}>{fmtMoney(c.valor)}</span>
            <span>vence {fmtDate(c.vencimento)}</span>
            <span>{c.dataPagamento ? `pago em ${fmtDate(c.dataPagamento)}` : 'em aberto'}</span>
            {c.geradaAutomaticamente && <span className="badge b-p">automática</span>}

            {editar && <button className="btn btn-d btn-xs" onClick={()=>excluirCobranca(c)} title="Excluir cobrança">🗑️</button>}
          </div>
        ))}
        {doCliente.length===0 && <div className="empty">Nenhuma cobrança lançada.</div>}
      </div>
    </div>
  );

function AbaTarefas({ cliente, tarefas, usuario }){
  const editar = podeEditar(usuario);
  const [nova, setNova] = useState({ descricao:'', responsavel:'', prazo: toInputDate(new Date()), prioridade:'MEDIA' });
  const [criando, setCriando] = useState(false);
  const doCliente = tarefas.filter(t=>t.clienteId===cliente.id).sort((a,b)=> (a.status==='PENDENTE'?0:1) - (b.status==='PENDENTE'?0:1) || toDate(a.prazo)-toDate(b.prazo));

  async function criar(){
    if (!nova.descricao || !nova.responsavel || !nova.prazo || criando) return;
    setCriando(true);
    try {
      await criarDoc('tarefas', { clienteId:cliente.id, descricao:nova.descricao, responsavel:nova.responsavel, prazo:new Date(nova.prazo+'T00:00:00').toISOString(), prioridade:nova.prioridade, status:'PENDENTE', automatica:false, criadoPor:usuario.nome, criadoEm:new Date().toISOString() });
      setNova({ descricao:'', responsavel:'', prazo: toInputDate(new Date()), prioridade:'MEDIA' });
    } finally {
      setCriando(false);
    }
  }
  async function concluir(t){ await atualizarDoc('tarefas', t.id, { status:'CONCLUIDA', dataConclusao:new Date().toISOString() }); }
  async function reabrir(t){ await atualizarDoc('tarefas', t.id, { status:'PENDENTE', dataConclusao:null }); }
  async function excluirTarefa(t){
    if (!confirm(`Excluir a tarefa "${t.descricao}"? Essa ação não pode ser desfeita.`)) return;
    await excluirDoc('tarefas', t.id);
  }

  return (
    <div>
      {editar && (
        <>
          <div className="fsec">Nova tarefa</div>
          <div className="fr">
            <div className="fg" style={{gridColumn:'1/3'}}><label className="fl">Descrição</label><input className="fi" value={nova.descricao} onChange={e=>setNova({...nova,descricao:e.target.value})} /></div>
            <div className="fg"><label className="fl">Responsável</label><input className="fi" value={nova.responsavel} onChange={e=>setNova({...nova,responsavel:e.target.value})} /></div>
            <div className="fg"><label className="fl">Prazo</label><input className="fi" type="date" value={nova.prazo} onChange={e=>setNova({...nova,prazo:e.target.value})} /></div>
          </div>
          <button className="btn btn-g btn-sm" onClick={criar} disabled={criando}>{criando?'Criando...':'Criar tarefa'}</button>
          <div className="fsec" style={{marginTop:16}}>Tarefas</div>
        </>
      )}
      <div className="tlist">
        {doCliente.map(t => {
          const atrasada = t.status==='PENDENTE' && diffDays(t.prazo, hojeSemHora())>0;
          return (
            <div key={t.id} className={`titem ${atrasada?'ov2':''}`}>
              <button className={`tcheck ${t.status==='CONCLUIDA'?'done':''}`} onClick={()=> t.status==='CONCLUIDA' ? reabrir(t) : concluir(t)}>{t.status==='CONCLUIDA'?'✓':''}</button>
              <div>
                <div style={{fontWeight:500}}>{t.descricao}</div>
                <div style={{color:'var(--t2)'}}>{t.responsavel} · prazo {fmtDate(t.prazo)}{t.automatica?' · automática':''}{atrasada?` · ⚠️ atrasada há ${diffDays(t.prazo,hojeSemHora())}d`:''}</div>
              </div>
              {editar && <button className="btn btn-d btn-xs" style={{marginLeft:'auto'}} onClick={()=>excluirTarefa(t)} title="Excluir tarefa">🗑️</button>}
            </div>
          );
        })}
        {doCliente.length===0 && <div className="empty">Nenhuma tarefa ainda.</div>}
      </div>
    </div>
  );
}
